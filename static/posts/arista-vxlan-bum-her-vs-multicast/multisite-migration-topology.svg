<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1100" viewBox="0 0 1560 1100" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1560" height="1100" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#2C2C2A">iBGP &#8594; eBGP everywhere migration - two-site topology, addressing &amp; ASNs</text>
  <text x="40" y="66" font-size="13" fill="#5F5E5A">Site A migrates leaf by leaf (ASN labels: before &#8594; after)  |  Site B stays iBGP + RR  |  DCI = EVPN route server</text>

  <!-- Zone separators -->
  <line x1="890" y1="96" x2="890" y2="920" stroke="#D3D1C7" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="1120" y1="96" x2="1120" y2="920" stroke="#D3D1C7" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="445" y="110" font-size="13" font-weight="bold" fill="#0C447C" text-anchor="middle">SITE A - AS 65000 &#8594; per-tier eBGP</text>
  <text x="1005" y="110" font-size="13" font-weight="bold" fill="#B9770E" text-anchor="middle">DCI - AS 65099</text>
  <text x="1340" y="110" font-size="13" font-weight="bold" fill="#085041" text-anchor="middle">SITE B - AS 65030, stays iBGP</text>

  <!-- ================= LINKS ================= -->
  <!-- Underlay links -->
  <g stroke="#378ADD" stroke-width="1.6" fill="none">
    <line x1="480" y1="206" x2="275" y2="330"/>    <!-- Border1-Spine1 -->
    <line x1="570" y1="206" x2="655" y2="330"/>    <!-- Border1-Spine2 -->
    <line x1="620" y1="168" x2="915" y2="168"/>    <!-- Border1-DCI -->
    <line x1="1105" y1="168" x2="1170" y2="168"/>  <!-- DCI-Border2 -->
    <line x1="1255" y1="206" x2="1285" y2="330"/>  <!-- Border2-sp31 -->
    <line x1="1295" y1="406" x2="1295" y2="590"/>  <!-- sp31-Leaf31 -->
    <line x1="245" y1="406" x2="120" y2="590"/>    <!-- Spine1-Leaf1 -->
    <line x1="275" y1="406" x2="430" y2="590"/>    <!-- Spine1-Leaf2 -->
    <line x1="305" y1="406" x2="730" y2="590"/>    <!-- Spine1-Leaf3 -->
    <line x1="625" y1="406" x2="140" y2="590"/>    <!-- Spine2-Leaf1 -->
    <line x1="645" y1="406" x2="450" y2="590"/>    <!-- Spine2-Leaf2 -->
    <line x1="675" y1="406" x2="750" y2="590"/>    <!-- Spine2-Leaf3 -->
  </g>

  <!-- MLAG -->
  <line x1="220" y1="628" x2="350" y2="628" stroke="#D85A30" stroke-width="1.8" stroke-dasharray="7 5"/>
  <g stroke="#D85A30" stroke-width="1.6" fill="none">
    <line x1="170" y1="666" x2="260" y2="850"/>
    <line x1="390" y1="666" x2="300" y2="850"/>
  </g>
  <rect x="25" y="574" width="520" height="108" rx="12" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="35" y="590" font-size="10.5" fill="#993C1D">MLAG pair - domain ekou_test, shared VTEP 10.255.255.112</text>

  <!-- Host links -->
  <g stroke="#888780" stroke-width="1.5" fill="none">
    <line x1="90" y1="666" x2="95" y2="850"/>
    <line x1="700" y1="666" x2="660" y2="850"/>
    <line x1="770" y1="666" x2="815" y2="850"/>
    <line x1="1250" y1="666" x2="1200" y2="850"/>
    <line x1="1340" y1="666" x2="1390" y2="850"/>
  </g>

  <!-- Link subnet labels -->
  <g font-size="11" fill="#0C447C" font-weight="bold">
    <text x="330" y="262">10.0.101.0/31</text>
    <text x="600" y="262">10.0.102.0/31</text>
    <text x="755" y="158" text-anchor="middle">10.0.103.0/31</text>
    <text x="1137" y="150" text-anchor="middle" font-size="10.5">10.0.104.0/31</text>
    <text x="1305" y="262">10.31.101.0/31</text>
    <text x="1305" y="500">10.31.11.0/31</text>
  </g>

  <!-- Interface tags -->
  <g font-size="10.5" fill="#185FA5">
    <text x="455" y="222">Et5</text>  <text x="282" y="324">Et5</text>
    <text x="576" y="222">Et4</text>  <text x="640" y="324">Et4</text>
    <text x="630" y="184">Et3</text>  <text x="878" y="184">Et3</text>
    <text x="1108" y="184">Et2</text> <text x="1148" y="184">Et2</text>
    <text x="1230" y="222">Et1</text> <text x="1262" y="324">Et1</text>
    <text x="1302" y="424">Et3</text> <text x="1302" y="584">Et3</text>
  </g>

  <!-- ================= NODES ================= -->
  <!-- Border1 -->
  <g>
    <rect x="430" y="130" width="190" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
    <text x="525" y="156" font-size="15" font-weight="bold" fill="#3C3489" text-anchor="middle">Border1</text>
    <text x="525" y="175" font-size="11" fill="#534AB7" text-anchor="middle">Lo0 10.255.255.1</text>
    <text x="525" y="193" font-size="11" font-weight="bold" fill="#B03A2E" text-anchor="middle">AS 65000 &#8594; 65100</text>
  </g>
  <!-- DCI -->
  <g>
    <rect x="915" y="130" width="190" height="76" rx="8" fill="#FEF5E7" stroke="#B9770E" stroke-width="1.2"/>
    <text x="1010" y="156" font-size="15" font-weight="bold" fill="#7E5109" text-anchor="middle">DCI</text>
    <text x="1010" y="175" font-size="11" fill="#B9770E" text-anchor="middle">Lo0 10.255.99.1</text>
    <text x="1010" y="193" font-size="11" font-weight="bold" fill="#7E5109" text-anchor="middle">AS 65099 - EVPN RS</text>
  </g>
  <!-- Border2 -->
  <g>
    <rect x="1170" y="130" width="190" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
    <text x="1265" y="156" font-size="15" font-weight="bold" fill="#3C3489" text-anchor="middle">Border2</text>
    <text x="1265" y="175" font-size="11" fill="#534AB7" text-anchor="middle">Lo0 10.255.31.1</text>
    <text x="1265" y="193" font-size="11" font-weight="bold" fill="#085041" text-anchor="middle">AS 65030</text>
  </g>
  <!-- Spines -->
  <g>
    <rect x="180" y="330" width="190" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
    <text x="275" y="356" font-size="15" font-weight="bold" fill="#0C447C" text-anchor="middle">Spine1 (RR)</text>
    <text x="275" y="375" font-size="11" fill="#185FA5" text-anchor="middle">Lo0 10.255.255.11</text>
    <text x="275" y="393" font-size="11" font-weight="bold" fill="#0C447C" text-anchor="middle">AS 65000 (keeps)</text>
  </g>
  <g>
    <rect x="560" y="330" width="190" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
    <text x="655" y="356" font-size="15" font-weight="bold" fill="#0C447C" text-anchor="middle">Spine2 (RR)</text>
    <text x="655" y="375" font-size="11" fill="#185FA5" text-anchor="middle">Lo0 10.255.255.12</text>
    <text x="655" y="393" font-size="11" font-weight="bold" fill="#0C447C" text-anchor="middle">AS 65000 (keeps)</text>
  </g>
  <g>
    <rect x="1200" y="330" width="190" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
    <text x="1295" y="356" font-size="15" font-weight="bold" fill="#0C447C" text-anchor="middle">SP31 (RR)</text>
    <text x="1295" y="375" font-size="11" fill="#185FA5" text-anchor="middle">Lo0 10.255.31.11</text>
    <text x="1295" y="393" font-size="11" font-weight="bold" fill="#085041" text-anchor="middle">AS 65030</text>
  </g>
  <!-- Leaves -->
  <g>
    <rect x="40" y="590" width="180" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
    <text x="130" y="616" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle">Leaf1</text>
    <text x="130" y="635" font-size="11" fill="#0F6E56" text-anchor="middle">Lo0 .21 &#183; VTEP .112</text>
    <text x="130" y="653" font-size="11" font-weight="bold" fill="#B03A2E" text-anchor="middle">AS 65000 &#8594; 65101</text>
  </g>
  <g>
    <rect x="350" y="590" width="180" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
    <text x="440" y="616" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle">Leaf2</text>
    <text x="440" y="635" font-size="11" fill="#0F6E56" text-anchor="middle">Lo0 .22 &#183; VTEP .112</text>
    <text x="440" y="653" font-size="11" font-weight="bold" fill="#B03A2E" text-anchor="middle">AS 65000 &#8594; 65101</text>
  </g>
  <g>
    <rect x="650" y="590" width="180" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
    <text x="740" y="616" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle">Leaf3</text>
    <text x="740" y="635" font-size="11" fill="#0F6E56" text-anchor="middle">Lo0 .23 &#183; VTEP .113</text>
    <text x="740" y="653" font-size="11" font-weight="bold" fill="#B03A2E" text-anchor="middle">AS 65000 &#8594; 65102</text>
  </g>
  <g>
    <rect x="1200" y="590" width="190" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
    <text x="1295" y="616" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle">Leaf31</text>
    <text x="1295" y="635" font-size="11" fill="#0F6E56" text-anchor="middle">Lo0 .31.21 &#183; VTEP .31.113</text>
    <text x="1295" y="653" font-size="11" font-weight="bold" fill="#085041" text-anchor="middle">AS 65030</text>
  </g>
  <!-- Hosts -->
  <g>
    <rect x="30" y="850" width="140" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.1"/>
    <text x="100" y="873" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">VPC1</text>
    <text x="100" y="891" font-size="10.5" fill="#5F5E5A" text-anchor="middle">vlan10 &#183; .10.10</text>
  </g>
  <g>
    <rect x="210" y="850" width="140" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.1"/>
    <text x="280" y="873" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">Switch</text>
    <text x="280" y="891" font-size="10.5" fill="#5F5E5A" text-anchor="middle">MLAG Po20 &#183; vlan20</text>
  </g>
  <g>
    <rect x="600" y="850" width="130" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.1"/>
    <text x="665" y="873" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">VPC2</text>
    <text x="665" y="891" font-size="10.5" fill="#5F5E5A" text-anchor="middle">vlan20 &#183; .20.20</text>
  </g>
  <g>
    <rect x="745" y="850" width="130" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.1"/>
    <text x="810" y="873" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">VPC3</text>
    <text x="810" y="891" font-size="10.5" fill="#5F5E5A" text-anchor="middle">vlan30 &#183; .30.30</text>
  </g>
  <g>
    <rect x="1130" y="850" width="150" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.1"/>
    <text x="1205" y="873" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">R_VPC1</text>
    <text x="1205" y="891" font-size="10.5" fill="#5F5E5A" text-anchor="middle">vlan10 &#183; .10.150</text>
  </g>
  <g>
    <rect x="1310" y="850" width="150" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.1"/>
    <text x="1385" y="873" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">R_VPC2</text>
    <text x="1385" y="891" font-size="10.5" fill="#5F5E5A" text-anchor="middle">vlan20 &#183; .20.150</text>
  </g>

  <!-- ================= REFERENCE BAND ================= -->
  <rect x="40" y="950" width="1480" height="120" rx="10" fill="#F8F7F3" stroke="#D3D1C7" stroke-width="1"/>
  <text x="60" y="974" font-size="13" font-weight="bold" fill="#2C2C2A">ASN plan (before &#8594; after)</text>
  <g font-size="11.5" fill="#444441">
    <text x="60" y="996">Spines 65000 (unchanged)  &#183;  Leaf1+Leaf2 65101 (MLAG pair)  &#183;  Leaf3 65102  &#183;  Border1 65100  &#183;  DCI 65099  &#183;  Site B 65030</text>
    <text x="60" y="1016">Stretched overlay: VLAN10/VNI1010 + VLAN20/VNI1020 + VRF TENANT_A L3VNI 50000  -  static RTs 1:10 / 1:20 / 1:50000 in both sites</text>
    <text x="60" y="1036">Site A internal /31s, MLAG, hosts unchanged (section 1.1)  &#183;  new /31s: DCI / spine side = .0, border / leaf side = .1</text>
    <text x="60" y="1056">Overlay eBGP sessions: loopback-to-loopback, ebgp-multihop 3, next-hop-unchanged at spines, borders, and DCI</text>
  </g>
  <line x1="1120" y1="960" x2="1120" y2="1060" stroke="#D3D1C7" stroke-width="1"/>
  <g font-size="11" fill="#444441">
    <rect x="1140" y="966" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5"/><text x="1160" y="977">Spine / RR</text>
    <rect x="1140" y="990" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="1160" y="1001">Leaf (VTEP)</text>
    <rect x="1140" y="1014" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="1160" y="1025">Border</text>
    <rect x="1290" y="966" width="14" height="14" rx="3" fill="#FEF5E7" stroke="#B9770E"/><text x="1310" y="977">Route server</text>
    <rect x="1290" y="990" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="1310" y="1001">Host</text>
    <text x="1290" y="1025" font-weight="bold" fill="#B03A2E">red = ASN changes</text>
  </g>
</svg>
