:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {

  text-decoration: none;

}

a:is(:hover, :focus-visible) {

  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);

}

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {

}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget > :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,

}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;

}

.btn:is(.btn-block, .viz-tile) {

}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);

}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {

[data-lucide] {

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {

  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);

textarea.form-control {
  height: auto;

  padding: 8px 10px;

}

.form-control:focus-visible {

}

.form-control:disabled,

  cursor: not-allowed;

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),

  background-position:

.form-select:not(:disabled):hover {

}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;

  border: 1px solid var(--input);

  border-color: var(--input);
  border-radius: var(--radius-sm);

.form-check:not(.form-switch)

}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {

}

  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {

  appearance: none;
  display: block;

  height: 28px;

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html>body{padding:0}</style>
</head>
<body>
<div id="nccl-collnet-allreduce-4gpu" class="collnet-viz">
  <div class="collnet-top">
    <div>
      <h2>CollNetDirect all-reduce · 4 GPUs</h2>
      <div class="collnet-key text-small" aria-label="A, B, C, and D are the reductions of chunks a, b, c, and d across GPU 0 through GPU 3">
        <span class="collnet-key-item"><span class="collnet-key-dot collnet-a"></span><code>A = ⊕aᵢ</code></span>
        <span class="collnet-key-item"><span class="collnet-key-dot collnet-b"></span><code>B = ⊕bᵢ</code></span>
        <span class="collnet-key-item"><span class="collnet-key-dot collnet-c"></span><code>C = ⊕cᵢ</code></span>
        <span class="collnet-key-item"><span class="collnet-key-dot collnet-d"></span><code>D = ⊕dᵢ</code></span>
        <span>2 nodes · 2 heads / rails</span>
      </div>
    </div>
    <div class="viz-controls" aria-label="Step controls">
      <button id="collnet-prev" type="button" class="btn btn-ghost">Previous</button>
      <button id="collnet-next" type="button" class="btn btn-primary">Next</button>
    </div>
  </div>

  <div class="collnet-status">
    <span id="collnet-phase" class="viz-badge">Input</span>
    <span id="collnet-step-label">Step 0 of 4 · Local vectors</span>
  </div>

  <div id="collnet-stage" class="collnet-stage">
    <svg id="collnet-svg" role="img" aria-label="Four GPUs in two nodes connected through two CollNet reduction rails"></svg>
  </div>

  <div id="collnet-summary" class="collnet-summary text-small text-muted" aria-live="polite"></div>
</div>

<style>
  #nccl-collnet-allreduce-4gpu {
    width: 100%;
    color: var(--foreground);
  }

  #nccl-collnet-allreduce-4gpu .collnet-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  #nccl-collnet-allreduce-4gpu h2 {
    margin: 0;
  }

  #nccl-collnet-allreduce-4gpu .collnet-key {
    display: flex;
    align-items: center;
    gap: 6px 12px;
    flex-wrap: wrap;
    margin-top: 5px;
    color: var(--muted-foreground);
  }

  #nccl-collnet-allreduce-4gpu .collnet-key-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  #nccl-collnet-allreduce-4gpu .collnet-key-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: 0 0 auto;
  }

  #nccl-collnet-allreduce-4gpu .collnet-a { background: var(--viz-series-1); }
  #nccl-collnet-allreduce-4gpu .collnet-b { background: var(--viz-series-2); }
  #nccl-collnet-allreduce-4gpu .collnet-c { background: var(--viz-series-3); }
  #nccl-collnet-allreduce-4gpu .collnet-d { background: var(--viz-series-4); }

  #nccl-collnet-allreduce-4gpu .collnet-status {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
    font-weight: 500;
  }

  #nccl-collnet-allreduce-4gpu .collnet-stage {
    width: 100%;
    margin-top: 2px;
  }

  #nccl-collnet-allreduce-4gpu .collnet-stage svg {
    display: block;
    width: 100%;
    overflow: visible;
  }

  #nccl-collnet-allreduce-4gpu .collnet-host {
    fill: color-mix(in srgb, var(--muted) 18%, transparent);
    stroke: var(--border);
    stroke-width: 1px;
  }

  #nccl-collnet-allreduce-4gpu .collnet-fabric {
    fill: color-mix(in srgb, var(--viz-series-6) 8%, transparent);
    stroke: var(--border);
    stroke-width: 1px;
  }

  #nccl-collnet-allreduce-4gpu .collnet-rail {
    fill: color-mix(in srgb, var(--muted) 42%, transparent);
  }

  #nccl-collnet-allreduce-4gpu .collnet-node {
    fill: color-mix(in srgb, var(--muted) 46%, transparent);
    stroke: var(--border);
    stroke-width: 1px;
  }

  #nccl-collnet-allreduce-4gpu .collnet-host-label,
  #nccl-collnet-allreduce-4gpu .collnet-fabric-label,
  #nccl-collnet-allreduce-4gpu .collnet-gpu-label,
  #nccl-collnet-allreduce-4gpu .collnet-head-label,
  #nccl-collnet-allreduce-4gpu .collnet-chip-label,
  #nccl-collnet-allreduce-4gpu .collnet-edge-label,
  #nccl-collnet-allreduce-4gpu .collnet-rail-label,
  #nccl-collnet-allreduce-4gpu .collnet-rail-status {
    fill: var(--foreground);
  }

  #nccl-collnet-allreduce-4gpu .collnet-host-label,
  #nccl-collnet-allreduce-4gpu .collnet-fabric-label,
  #nccl-collnet-allreduce-4gpu .collnet-gpu-label {
    font-size: 14px;
    font-weight: 500;
  }

  #nccl-collnet-allreduce-4gpu .collnet-head-label,
  #nccl-collnet-allreduce-4gpu .collnet-rail-status {
    fill: var(--muted-foreground);
    font-size: 12px;
    font-weight: 400;
  }

  #nccl-collnet-allreduce-4gpu .collnet-chip-label,
  #nccl-collnet-allreduce-4gpu .collnet-edge-label,
  #nccl-collnet-allreduce-4gpu .collnet-rail-label {
    font-size: 12px;
    font-weight: 400;
  }

  #nccl-collnet-allreduce-4gpu .collnet-chip-label.is-hot {
    font-weight: 500;
  }

  #nccl-collnet-allreduce-4gpu .collnet-edge {

    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #nccl-collnet-allreduce-4gpu .collnet-summary {
    min-height: 1.5em;
    margin-top: 3px;
  }

  @media (max-width: 520px) {
    #nccl-collnet-allreduce-4gpu .viz-controls {
      width: 100%;
      justify-content: space-between;
    }
  }
</style>

<script>
(() => {
  const root = document.getElementById('nccl-collnet-allreduce-4gpu');
  const svg = root.querySelector('#collnet-svg');
  const stage = root.querySelector('#collnet-stage');
  const previousButton = root.querySelector('#collnet-prev');
  const nextButton = root.querySelector('#collnet-next');
  const phaseLabel = root.querySelector('#collnet-phase');
  const stepLabel = root.querySelector('#collnet-step-label');
  const summary = root.querySelector('#collnet-summary');
  const svgNS = 'http://www.w3.org/2000/svg';
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  const chunkColor = {
    a: 'var(--viz-series-1)',
    b: 'var(--viz-series-2)',
    c: 'var(--viz-series-3)',
    d: 'var(--viz-series-4)'
  };

  const chunkSurface = {
    a: 'color-mix(in srgb, var(--viz-series-1) 16%, transparent)',
    b: 'color-mix(in srgb, var(--viz-series-2) 16%, transparent)',
    c: 'color-mix(in srgb, var(--viz-series-3) 16%, transparent)',
    d: 'color-mix(in srgb, var(--viz-series-4) 16%, transparent)'
  };

  const hotSurface = {
    a: 'color-mix(in srgb, var(--viz-series-1) 28%, transparent)',
    b: 'color-mix(in srgb, var(--viz-series-2) 28%, transparent)',
    c: 'color-mix(in srgb, var(--viz-series-3) 28%, transparent)',
    d: 'color-mix(in srgb, var(--viz-series-4) 28%, transparent)'
  };

  const flowColor = {
    local: 'var(--viz-series-5)',
    network: 'var(--viz-series-6)'
  };

  const chip = (id, label, hot = false) => ({ id, label, hot });
  const gpu = (items) => ({ items });
  const rail = (items = [], status = '', hot = false) => ({ items, status, hot });
  // offset shifts the path perpendicular to its own direction (right of travel is positive),
  // labelShift pushes the label further out on the same side so paired opposite-direction
  // transfers on one short edge never overlap each other
  const transfer = (from, to, label, offset = 0, labelShift = 11) => ({ from, to, label, offset, labelShift });
  const localVector = (index) => {
    const subscript = '₀₁₂₃'[index];
    return [chip('a', `a${subscript}`), chip('b', `b${subscript}`), chip('c', `c${subscript}`), chip('d', `d${subscript}`)];
  };
  const fullVector = (hot = false) => [chip('a', 'A', hot), chip('b', 'B', hot), chip('c', 'C', hot), chip('d', 'D', hot)];

  const states = [
    {
      phase: 'Input',
      title: 'Step 0 of 4 · Local vectors',
      summary: 'Node A contains GPU0/1; Node B contains GPU2/3. Head 0 owns a,b and head 1 owns c,d.',
      flow: 'local',
      nodes: [gpu(localVector(0)), gpu(localVector(1)), gpu(localVector(2)), gpu(localVector(3))],
      rails: [rail([], 'ready'), rail([], 'ready')],
      transfers: []
    },
    {
      phase: 'Scatter',
      title: 'Step 1 of 4 · Local scatter',
      summary: 'Each GPU sends its non-owned slice to the matching local head; the two operands are paired but not yet reduced.',
      flow: 'local',
      nodes: [
        gpu([chip('a', 'a₀ | a₁', true), chip('b', 'b₀ | b₁', true)]),
        gpu([chip('c', 'c₀ | c₁', true), chip('d', 'd₀ | d₁', true)]),
        gpu([chip('a', 'a₂ | a₃', true), chip('b', 'b₂ | b₃', true)]),
        gpu([chip('c', 'c₂ | c₃', true), chip('d', 'd₂ | d₃', true)])
      ],
      rails: [rail([], 'ready'), rail([], 'ready')],
      transfers: [
        transfer('g1', 'g0', 'a₁,b₁', 14, 30),
        transfer('g0', 'g1', 'c₀,d₀', 14, 30),
        transfer('g3', 'g2', 'a₃,b₃', 14, 30),
        transfer('g2', 'g3', 'c₂,d₂', 14, 30)
      ]
    },
    {
      phase: 'Local reduce',
      title: 'Step 2 of 4 · Reduce and send',
      summary: 'Each head reduces its two local contributions, then uploads one node-level partial on its assigned rail.',
      flow: 'network',
      nodes: [
        gpu([chip('a', 'a₀⊕a₁', true), chip('b', 'b₀⊕b₁', true)]),
        gpu([chip('c', 'c₀⊕c₁', true), chip('d', 'd₀⊕d₁', true)]),
        gpu([chip('a', 'a₂⊕a₃', true), chip('b', 'b₂⊕b₃', true)]),
        gpu([chip('c', 'c₂⊕c₃', true), chip('d', 'd₂⊕d₃', true)])
      ],
      rails: [rail([], '2 partials in'), rail([], '2 partials in')],
      transfers: [
        transfer('g0', 'r0', 'AB₀₁'),
        transfer('g2', 'r0', 'AB₂₃'),
        transfer('g1', 'r1', 'CD₀₁'),
        transfer('g3', 'r1', 'CD₂₃')
      ]
    },
    {
      phase: 'Network reduce',
      title: 'Step 3 of 4 · In-network all-reduce',
      summary: 'The CollNet fabric reduces both node partials per rail and returns [A,B] or [C,D] to the matching heads.',
      flow: 'network',
      nodes: [
        gpu([chip('a', 'A', true), chip('b', 'B', true)]),
        gpu([chip('c', 'C', true), chip('d', 'D', true)]),
        gpu([chip('a', 'A', true), chip('b', 'B', true)]),
        gpu([chip('c', 'C', true), chip('d', 'D', true)])
      ],
      rails: [rail([chip('a', 'A', true), chip('b', 'B', true)], '', true), rail([chip('c', 'C', true), chip('d', 'D', true)], '', true)],
      transfers: [
        transfer('r0', 'g0', 'A,B'),
        transfer('r0', 'g2', 'A,B'),
        transfer('r1', 'g1', 'C,D'),
        transfer('r1', 'g3', 'C,D')
      ]
    },
    {
      phase: 'Gather',
      title: 'Step 4 of 4 · Local broadcast and gather',
      summary: 'The two local heads exchange returned slices; every GPU assembles the complete reduced [A, B, C, D].',
      flow: 'local',
      nodes: [gpu(fullVector(true)), gpu(fullVector(true)), gpu(fullVector(true)), gpu(fullVector(true))],
      rails: [rail([chip('a', 'A'), chip('b', 'B')]), rail([chip('c', 'C'), chip('d', 'D')])],
      transfers: [
        transfer('g0', 'g1', 'A,B', 14, 30),
        transfer('g1', 'g0', 'C,D', 14, 30),
        transfer('g2', 'g3', 'A,B', 14, 30),
        transfer('g3', 'g2', 'C,D', 14, 30)
      ]
    }
  ];

  let currentStep = 0;
  let lastWidth = 0;
  let animationFrames = [];

  function makeSvg(name, attributes = {}) {
    const element = document.createElementNS(svgNS, name);
    Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
    return element;
  }

  function addMarker(defs, id, color) {
    const marker = makeSvg('marker', {
      id,
      viewBox: '0 0 10 10',
      refX: '8.5',
      refY: '5',
      markerWidth: '6',
      markerHeight: '6',
      orient: 'auto-start-reverse'
    });
    marker.appendChild(makeSvg('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: color }));
    defs.appendChild(marker);
  }

  function edgePoints(from, to, offset = 0) {
    const dx = to.cx - from.cx;
    const dy = to.cy - from.cy;
    const fromScale = Math.min(
      dx === 0 ? Infinity : (from.width / 2 + 6) / Math.abs(dx),
      dy === 0 ? Infinity : (from.height / 2 + 6) / Math.abs(dy)
    );
    const toScale = Math.min(
      dx === 0 ? Infinity : (to.width / 2 + 9) / Math.abs(dx),
      dy === 0 ? Infinity : (to.height / 2 + 9) / Math.abs(dy)
    );
    const magnitude = Math.hypot(dx, dy) || 1;
    const ox = -(dy / magnitude) * offset;
    const oy = (dx / magnitude) * offset;
    return {
      start: { x: from.cx + dx * fromScale + ox, y: from.cy + dy * fromScale + oy },
      end: { x: to.cx - dx * toScale + ox, y: to.cy - dy * toScale + oy }
    };
  }

  function renderGroupBox(x, y, width, height, label) {
    svg.appendChild(makeSvg('rect', { class: 'collnet-host', x, y, width, height, rx: '12' }));
    const text = makeSvg('text', { class: 'collnet-host-label', x: x + 12, y: y + 23 });
    text.textContent = label;
    svg.appendChild(text);
  }

  function renderGpu(entity, gpuIndex, nodeState, nodeWidth, nodeHeight) {
    const group = makeSvg('g', { 'aria-label': `GPU${gpuIndex}, head ${gpuIndex % 2}: ${nodeState.items.map((item) => item.label).join(', ')}` });
    const x = entity.cx - nodeWidth / 2;
    const y = entity.cy - nodeHeight / 2;
    group.appendChild(makeSvg('rect', { class: 'collnet-node', x, y, width: nodeWidth, height: nodeHeight, rx: '12' }));

    const gpuLabel = makeSvg('text', { class: 'collnet-gpu-label', x: x + 12, y: y + 23 });
    gpuLabel.textContent = `GPU${gpuIndex}`;
    group.appendChild(gpuLabel);

    const headLabel = makeSvg('text', { class: 'collnet-head-label', x: x + nodeWidth - 12, y: y + 22, 'text-anchor': 'end' });
    headLabel.textContent = `head ${gpuIndex % 2}`;
    group.appendChild(headLabel);

    const gap = 6;
    const chipWidth = (nodeWidth - 20 - gap) / 2;
    const chipHeight = 28;
    nodeState.items.forEach((item, index) => {
      const column = index % 2;
      const row = Math.floor(index / 2);
      const chipX = x + 10 + column * (chipWidth + gap);
      const chipY = y + 39 + row * (chipHeight + gap);
      group.appendChild(makeSvg('rect', {
        x: chipX,
        y: chipY,
        width: chipWidth,
        height: chipHeight,
        rx: '8',
        fill: item.hot ? hotSurface[item.id] : chunkSurface[item.id],
        stroke: item.hot ? chunkColor[item.id] : 'none',
        'stroke-width': item.hot ? '1.5' : '0'
      }));
      const label = makeSvg('text', {
        class: `collnet-chip-label${item.hot ? ' is-hot' : ''}`,
        x: chipX + chipWidth / 2,
        y: chipY + chipHeight / 2,
        'text-anchor': 'middle',
        'dominant-baseline': 'central'
      });
      label.textContent = item.label;
      group.appendChild(label);
    });
    svg.appendChild(group);
  }

  function renderFabric(layout, railStates) {
    svg.appendChild(makeSvg('rect', {
      class: 'collnet-fabric',
      x: layout.fabric.x,
      y: layout.fabric.y,
      width: layout.fabric.width,
      height: layout.fabric.height,
      rx: '12'
    }));
    const title = makeSvg('text', { class: 'collnet-fabric-label', x: layout.fabric.x + 12, y: layout.fabric.y + 23 });
    title.textContent = 'CollNet fabric';
    svg.appendChild(title);

    ['r0', 'r1'].forEach((railId, index) => {
      const entity = layout.entities[railId];
      const state = railStates[index];
      const x = entity.cx - entity.width / 2;
      const y = entity.cy - entity.height / 2;
      svg.appendChild(makeSvg('rect', { class: 'collnet-rail', x, y, width: entity.width, height: entity.height, rx: '9' }));
      const railLabel = makeSvg('text', { class: 'collnet-rail-label', x: x + 10, y: y + 17 });
      railLabel.textContent = index === 0 ? 'Rail 0 · a,b' : 'Rail 1 · c,d';
      svg.appendChild(railLabel);

      if (state.items.length) {
        const gap = 5;
        const itemWidth = Math.min(42, (entity.width - 20 - gap) / 2);
        const startX = entity.cx - (itemWidth * 2 + gap) / 2;
        state.items.forEach((item, itemIndex) => {
          const chipX = startX + itemIndex * (itemWidth + gap);
          const chipY = y + entity.height - 29;
          svg.appendChild(makeSvg('rect', {
            x: chipX,
            y: chipY,
            width: itemWidth,
            height: 23,
            rx: '7',
            fill: item.hot ? hotSurface[item.id] : chunkSurface[item.id],
            stroke: item.hot ? chunkColor[item.id] : 'none',
            'stroke-width': item.hot ? '1.5' : '0'
          }));
          const itemLabel = makeSvg('text', {
            class: `collnet-chip-label${item.hot ? ' is-hot' : ''}`,
            x: chipX + itemWidth / 2,
            y: chipY + 11.5,
            'text-anchor': 'middle',
            'dominant-baseline': 'central'
          });
          itemLabel.textContent = item.label;
          svg.appendChild(itemLabel);
        });
      } else {
        const railStatus = makeSvg('text', {
          class: 'collnet-rail-status',
          x: entity.cx,
          y: y + entity.height - 14,
          'text-anchor': 'middle'
        });
        railStatus.textContent = state.status;
        svg.appendChild(railStatus);
      }
    });
  }

  function renderEdgeLabel(path, label, color, shift = 11) {
    const length = path.getTotalLength();
    const point = path.getPointAtLength(length / 2);
    const before = path.getPointAtLength(Math.max(0, length / 2 - 1));
    const after = path.getPointAtLength(Math.min(length, length / 2 + 1));
    const dx = after.x - before.x;
    const dy = after.y - before.y;
    const magnitude = Math.hypot(dx, dy) || 1;
    const x = point.x - (dy / magnitude) * shift;
    const y = point.y + (dx / magnitude) * shift;
    const width = Math.max(42, [...label].length * 7 + 25);
    const group = makeSvg('g');
    group.appendChild(makeSvg('rect', { x: x - width / 2, y: y - 12, width, height: 24, fill: 'var(--background)' }));
    group.appendChild(makeSvg('circle', { cx: x - width / 2 + 9, cy: y, r: '4', fill: color }));
    const text = makeSvg('text', {
      class: 'collnet-edge-label',
      x: x + 4,
      y,
      'text-anchor': 'middle',
      'dominant-baseline': 'central'
    });
    text.textContent = label;
    group.appendChild(text);
    svg.appendChild(group);
  }

  function animatePacket(path, color) {
    if (reducedMotion.matches) return;
    const packet = makeSvg('circle', { r: '5', fill: color, 'aria-hidden': 'true' });
    svg.appendChild(packet);
    const length = path.getTotalLength();
    const startedAt = performance.now();
    const duration = 650;
    function frame(now) {
      const progress = Math.min(1, (now - startedAt) / duration);
      const eased = 1 - Math.pow(1 - progress, 3);
      const point = path.getPointAtLength(length * eased);
      packet.setAttribute('cx', point.x);
      packet.setAttribute('cy', point.y);
      if (progress < 1) {
        const frameId = requestAnimationFrame(frame);
        animationFrames.push(frameId);
      } else {
        packet.remove();
      }
    }
    const frameId = requestAnimationFrame(frame);
    animationFrames.push(frameId);
  }

  function buildLayout(width) {
    const compact = width < 560;
    const margin = 8;
    const nodeHeight = 116;
    if (!compact) {
      const fabricWidth = 150;
      const gap = 18;
      const hostWidth = Math.min(210, (width - margin * 2 - fabricWidth - gap * 2) / 2);
      const nodeWidth = hostWidth - 24;
      const hostY = 42;
      const hostHeight = 330;
      const gpuTopY = hostY + 36;
      const gpuBottomY = gpuTopY + nodeHeight + 44;
      const leftHostX = margin;
      const rightHostX = width - margin - hostWidth;
      const fabricX = (width - fabricWidth) / 2;
      const fabricY = 70;
      const fabricHeight = 274;
      const topCenterY = gpuTopY + nodeHeight / 2;
      const bottomCenterY = gpuBottomY + nodeHeight / 2;
      const railWidth = fabricWidth - 20;
      const railHeight = 58;
      const entities = {
        g0: { cx: leftHostX + hostWidth / 2, cy: topCenterY, width: nodeWidth, height: nodeHeight },
        g1: { cx: leftHostX + hostWidth / 2, cy: bottomCenterY, width: nodeWidth, height: nodeHeight },
        g2: { cx: rightHostX + hostWidth / 2, cy: topCenterY, width: nodeWidth, height: nodeHeight },
        g3: { cx: rightHostX + hostWidth / 2, cy: bottomCenterY, width: nodeWidth, height: nodeHeight },
        r0: { cx: width / 2, cy: topCenterY, width: railWidth, height: railHeight },
        r1: { cx: width / 2, cy: bottomCenterY, width: railWidth, height: railHeight }
      };
      return {
        compact,
        height: 412,
        nodeWidth,
        nodeHeight,
        hosts: [
          { x: leftHostX, y: hostY, width: hostWidth, height: hostHeight, label: 'Node A' },
          { x: rightHostX, y: hostY, width: hostWidth, height: hostHeight, label: 'Node B' }
        ],
        fabric: { x: fabricX, y: fabricY, width: fabricWidth, height: fabricHeight },
        entities
      };
    }

    const hostWidth = width - margin * 2;
    const nodeWidth = Math.min(180, (hostWidth - 36) / 2);
    const hostHeight = 166;
    const topHostY = 40;
    const fabricY = 235;
    const fabricHeight = 136;
    const bottomHostY = 400;
    const leftNodeX = margin + 12;
    const rightNodeX = width - margin - 12 - nodeWidth;
    const topGpuY = topHostY + 36;
    const bottomGpuY = bottomHostY + 36;
    const railY = fabricY + 42;
    const railHeight = 72;
    const entities = {
      g0: { cx: leftNodeX + nodeWidth / 2, cy: topGpuY + nodeHeight / 2, width: nodeWidth, height: nodeHeight },
      g1: { cx: rightNodeX + nodeWidth / 2, cy: topGpuY + nodeHeight / 2, width: nodeWidth, height: nodeHeight },
      g2: { cx: leftNodeX + nodeWidth / 2, cy: bottomGpuY + nodeHeight / 2, width: nodeWidth, height: nodeHeight },
      g3: { cx: rightNodeX + nodeWidth / 2, cy: bottomGpuY + nodeHeight / 2, width: nodeWidth, height: nodeHeight },
      r0: { cx: leftNodeX + nodeWidth / 2, cy: railY + railHeight / 2, width: nodeWidth, height: railHeight },
      r1: { cx: rightNodeX + nodeWidth / 2, cy: railY + railHeight / 2, width: nodeWidth, height: railHeight }
    };
    return {
      compact,
      height: 606,
      nodeWidth,
      nodeHeight,
      hosts: [
        { x: margin, y: topHostY, width: hostWidth, height: hostHeight, label: 'Node A' },
        { x: margin, y: bottomHostY, width: hostWidth, height: hostHeight, label: 'Node B' }
      ],
      fabric: { x: margin, y: fabricY, width: hostWidth, height: fabricHeight },
      entities
    };
  }

  function describeState(state) {
    const transfers = state.transfers.length
      ? state.transfers.map((item) => `${item.from} sends ${item.label} to ${item.to}`).join('; ')
      : 'No transfer yet';
    const holdings = state.nodes.map((nodeState, gpuIndex) => `GPU${gpuIndex} holds ${nodeState.items.map((item) => item.label).join(', ')}`).join('; ');
    return `${state.phase}. ${transfers}. ${holdings}.`;
  }

  function draw(animate = false) {
    animationFrames.forEach((frameId) => cancelAnimationFrame(frameId));
    animationFrames = [];
    svg.replaceChildren();

    const state = states[currentStep];
    const measuredWidth = Math.round(stage.getBoundingClientRect().width);
    const width = Math.max(320, measuredWidth || 736);
    const layout = buildLayout(width);
    lastWidth = width;
    svg.setAttribute('viewBox', `0 0 ${width} ${layout.height}`);
    svg.setAttribute('height', String(layout.height));
    svg.style.height = `${layout.height}px`;
    svg.setAttribute('aria-label', describeState(state));

    const defs = makeSvg('defs');
    addMarker(defs, 'collnet4-arrow-local', flowColor.local);
    addMarker(defs, 'collnet4-arrow-network', flowColor.network);
    svg.appendChild(defs);

    layout.hosts.forEach((host) => renderGroupBox(host.x, host.y, host.width, host.height, host.label));
    renderFabric(layout, state.rails);

    const topology = [['g0', 'g1'], ['g2', 'g3'], ['g0', 'r0'], ['g2', 'r0'], ['g1', 'r1'], ['g3', 'r1']];
    topology.forEach(([from, to]) => {
      const points = edgePoints(layout.entities[from], layout.entities[to]);
      svg.appendChild(makeSvg('path', {
        class: 'collnet-edge',
        d: `M ${points.start.x} ${points.start.y} L ${points.end.x} ${points.end.y}`,
        stroke: 'var(--border)',
        'stroke-width': '1.5'
      }));
    });

    const activeColor = flowColor[state.flow];
    const activePaths = state.transfers.map((item) => {
      const points = edgePoints(layout.entities[item.from], layout.entities[item.to], item.offset);
      const path = makeSvg('path', {
        class: 'collnet-edge',
        d: `M ${points.start.x} ${points.start.y} L ${points.end.x} ${points.end.y}`,
        stroke: activeColor,
        'stroke-width': '2.5',
        'marker-end': `url(#collnet4-arrow-${state.flow})`
      });
      svg.appendChild(path);
      return { path, item };
    });

    ['g0', 'g1', 'g2', 'g3'].forEach((id, gpuIndex) => {
      renderGpu(layout.entities[id], gpuIndex, state.nodes[gpuIndex], layout.nodeWidth, layout.nodeHeight);
    });

    activePaths.forEach(({ path, item }) => {
      renderEdgeLabel(path, item.label, activeColor, item.labelShift);
      if (animate) animatePacket(path, activeColor);
    });

    phaseLabel.textContent = state.phase;
    stepLabel.textContent = state.title;
    summary.textContent = state.summary;
    previousButton.disabled = currentStep === 0;
    nextButton.disabled = currentStep === states.length - 1;
  }

  previousButton.addEventListener('click', () => {
    if (currentStep > 0) {
      currentStep -= 1;
      draw(true);
    }
  });

  nextButton.addEventListener('click', () => {
    if (currentStep < states.length - 1) {
      currentStep += 1;
      draw(true);
    }
  });

  const resizeObserver = new ResizeObserver((entries) => {
    const nextWidth = Math.round(entries[0].contentRect.width);
    if (nextWidth && Math.abs(nextWidth - lastWidth) > 1) draw(false);
  });
  resizeObserver.observe(stage);
  draw(false);
})();
</script>

<style>
  /* pinned to the blog's m10c palette so the embed blends into the post */
  :root {
    color-scheme: dark;
    --color-background-primary: #353b43;
    --color-background-secondary: #3f464f;
    --color-text-primary: #d6dde3;
    --color-text-secondary: rgb(214 221 227 / 62%);
    --color-text-info: #57cc8a;
    --color-background-info: rgb(87 204 138 / 16%);
    --color-border-primary: rgb(255 255 255 / 14%);
    --color-border-secondary: rgb(255 255 255 / 10%);
  }
  html > body { padding: 6px 2px; }
</style>
<script>
(() => {
  const report = () => parent.postMessage(
    { type: "embed-height", height: Math.ceil(document.body.getBoundingClientRect().height) }, "*");
  new ResizeObserver(report).observe(document.body);
  window.addEventListener("load", report);
})();
</script>
</body>
