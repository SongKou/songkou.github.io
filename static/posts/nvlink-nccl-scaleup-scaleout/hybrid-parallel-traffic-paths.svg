<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ao" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E67E22"/>
    </marker>
    <marker id="an" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3B5C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1180" fill="#ffffff"/>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="#2C2C2A">Hybrid-parallel traffic paths &#8212; which domain each parallelism lives in</text>
  <text x="40" y="64" font-size="13" fill="#5F5E5A">TP stays inside the NVLink domain; PP and DP cross nodes over the fabric you operate</text>

  <!-- ============ TP band ============ -->
  <rect x="60" y="200" width="120" height="70" rx="10" fill="#0C447C"/>
  <text x="120" y="232" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">TP</text>
  <text x="120" y="254" font-size="11" fill="#ffffff" text-anchor="middle">Tensor Parallel</text>

  <!-- ring arrows (adjacent GPU pairs) -->
  <g stroke="#E67E22" stroke-width="3.5" marker-start="url(#ao)" marker-end="url(#ao)">
    <line x1="551" y1="150" x2="577" y2="161"/>
    <line x1="621" y1="205" x2="632" y2="231"/>
    <line x1="632" y1="293" x2="621" y2="319"/>
    <line x1="577" y1="363" x2="551" y2="374"/>
    <line x1="489" y1="374" x2="463" y2="363"/>
    <line x1="419" y1="319" x2="408" y2="293"/>
    <line x1="408" y1="231" x2="419" y2="205"/>
    <line x1="463" y1="161" x2="489" y2="150"/>
  </g>

  <!-- NVSwitch center -->
  <rect x="460" y="230" width="120" height="64" rx="8" fill="#ffffff" stroke="#E67E22" stroke-width="2"/>
  <text x="520" y="268" font-size="14" font-weight="bold" fill="#B9770E" text-anchor="middle">NVSwitch</text>

  <!-- GPU ring -->
  <g>
    <circle cx="520" cy="137" r="27" fill="#0C447C"/><text x="520" y="142" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU0</text>
    <circle cx="608" cy="174" r="27" fill="#0C447C"/><text x="608" y="179" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU1</text>
    <circle cx="645" cy="262" r="27" fill="#0C447C"/><text x="645" y="267" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU2</text>
    <circle cx="608" cy="350" r="27" fill="#0C447C"/><text x="608" y="355" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU3</text>
    <circle cx="520" cy="387" r="27" fill="#0C447C"/><text x="520" y="392" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU4</text>
    <circle cx="432" cy="350" r="27" fill="#0C447C"/><text x="432" y="355" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU5</text>
    <circle cx="395" cy="262" r="27" fill="#0C447C"/><text x="395" y="267" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU6</text>
    <circle cx="432" cy="174" r="27" fill="#0C447C"/><text x="432" y="179" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU7</text>
  </g>

  <line x1="730" y1="190" x2="730" y2="320" stroke="#E67E22" stroke-width="3"/>
  <text x="748" y="222" font-size="13" font-weight="bold" fill="#2C2C2A">Inside the NVLink domain &#8212;</text>
  <text x="748" y="242" font-size="13" font-weight="bold" fill="#2C2C2A">never crosses a switch</text>
  <text x="748" y="268" font-size="12" fill="#5F5E5A">dozens of collectives per training step;</text>
  <text x="748" y="286" font-size="12" fill="#5F5E5A">extreme latency sensitivity; NCCL keeps</text>
  <text x="748" y="304" font-size="12" fill="#5F5E5A">the TP group on NVLink automatically</text>

  <line x1="60" y1="445" x2="940" y2="445" stroke="#D3D1C7" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ============ PP band ============ -->
  <rect x="60" y="560" width="120" height="70" rx="10" fill="#1F5FA8"/>
  <text x="120" y="592" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">PP</text>
  <text x="120" y="614" font-size="11" fill="#ffffff" text-anchor="middle">Pipeline Parallel</text>

  <!-- Node A -->
  <rect x="220" y="545" width="140" height="100" rx="8" fill="#1F3B5C"/>
  <rect x="232" y="557" width="116" height="18" rx="3" fill="#35597F"/>
  <rect x="232" y="585" width="116" height="18" rx="3" fill="#35597F"/>
  <rect x="232" y="613" width="116" height="18" rx="3" fill="#35597F"/>
  <text x="290" y="668" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Node A</text>

  <!-- switch diamond -->
  <polygon points="470,548 522,595 470,642 418,595" fill="#1F3B5C"/>
  <g stroke="#ffffff" stroke-width="4">
    <line x1="470" y1="565" x2="470" y2="625"/>
    <line x1="440" y1="595" x2="500" y2="595"/>
  </g>
  <text x="470" y="668" font-size="12" fill="#5F5E5A" text-anchor="middle">fabric switch (leaf/spine)</text>

  <!-- Node B -->
  <rect x="580" y="545" width="140" height="100" rx="8" fill="#1F3B5C"/>
  <rect x="592" y="557" width="116" height="18" rx="3" fill="#35597F"/>
  <rect x="592" y="585" width="116" height="18" rx="3" fill="#35597F"/>
  <rect x="592" y="613" width="116" height="18" rx="3" fill="#35597F"/>
  <text x="650" y="668" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Node B</text>

  <g stroke="#1F3B5C" stroke-width="4" marker-start="url(#an)" marker-end="url(#an)">
    <line x1="364" y1="595" x2="414" y2="595"/>
    <line x1="526" y1="595" x2="576" y2="595"/>
  </g>

  <line x1="750" y1="540" x2="750" y2="650" stroke="#1F3B5C" stroke-width="3"/>
  <text x="768" y="566" font-size="13" font-weight="bold" fill="#2C2C2A">Cross-node, moderate volume</text>
  <text x="768" y="592" font-size="12" fill="#5F5E5A">micro-batch activations forward,</text>
  <text x="768" y="610" font-size="12" fill="#5F5E5A">gradients back (send/recv);</text>
  <text x="768" y="628" font-size="12" fill="#5F5E5A">overlaps with compute &#8212; latency-tolerant</text>

  <line x1="60" y1="745" x2="940" y2="745" stroke="#D3D1C7" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ============ DP band ============ -->
  <rect x="60" y="900" width="120" height="70" rx="10" fill="#4C7FB5"/>
  <text x="120" y="932" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">DP</text>
  <text x="120" y="954" font-size="11" fill="#ffffff" text-anchor="middle">Data Parallel</text>

  <!-- Node A top -->
  <rect x="400" y="770" width="140" height="85" rx="8" fill="#1F3B5C"/>
  <rect x="412" y="781" width="116" height="16" rx="3" fill="#35597F"/>
  <rect x="412" y="805" width="116" height="16" rx="3" fill="#35597F"/>
  <rect x="412" y="829" width="116" height="16" rx="3" fill="#35597F"/>
  <text x="555" y="818" font-size="13" font-weight="bold" fill="#2C2C2A">Node A</text>

  <!-- switch diamond center -->
  <polygon points="470,888 522,935 470,982 418,935" fill="#1F3B5C"/>
  <g stroke="#ffffff" stroke-width="4">
    <line x1="470" y1="905" x2="470" y2="965"/>
    <line x1="440" y1="935" x2="500" y2="935"/>
  </g>

  <!-- Node B left -->
  <rect x="190" y="890" width="140" height="85" rx="8" fill="#1F3B5C"/>
  <rect x="202" y="901" width="116" height="16" rx="3" fill="#35597F"/>
  <rect x="202" y="925" width="116" height="16" rx="3" fill="#35597F"/>
  <rect x="202" y="949" width="116" height="16" rx="3" fill="#35597F"/>
  <text x="260" y="995" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Node B</text>

  <!-- Node C right -->
  <rect x="610" y="890" width="140" height="85" rx="8" fill="#1F3B5C"/>
  <rect x="622" y="901" width="116" height="16" rx="3" fill="#35597F"/>
  <rect x="622" y="925" width="116" height="16" rx="3" fill="#35597F"/>
  <rect x="622" y="949" width="116" height="16" rx="3" fill="#35597F"/>
  <text x="680" y="995" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Node C</text>

  <!-- Node D bottom -->
  <rect x="400" y="1000" width="140" height="85" rx="8" fill="#1F3B5C"/>
  <rect x="412" y="1011" width="116" height="16" rx="3" fill="#35597F"/>
  <rect x="412" y="1035" width="116" height="16" rx="3" fill="#35597F"/>
  <rect x="412" y="1059" width="116" height="16" rx="3" fill="#35597F"/>
  <text x="555" y="1048" font-size="13" font-weight="bold" fill="#2C2C2A">Node D</text>
  <text x="600" y="1078" font-size="18" fill="#5F5E5A">&#8230;</text>

  <g stroke="#1F3B5C" stroke-width="4" marker-start="url(#an)" marker-end="url(#an)">
    <line x1="470" y1="859" x2="470" y2="884"/>
    <line x1="334" y1="935" x2="414" y2="935"/>
    <line x1="526" y1="935" x2="606" y2="935"/>
    <line x1="470" y1="986" x2="470" y2="996"/>
  </g>

  <line x1="780" y1="880" x2="780" y2="990" stroke="#1F3B5C" stroke-width="3"/>
  <text x="798" y="906" font-size="13" font-weight="bold" fill="#2C2C2A">Cross-node, highest</text>
  <text x="798" y="926" font-size="13" font-weight="bold" fill="#2C2C2A">bandwidth demand</text>
  <text x="798" y="952" font-size="12" fill="#5F5E5A">full-gradient AllReduce</text>
  <text x="798" y="970" font-size="12" fill="#5F5E5A">every step &#8212; what the</text>
  <text x="798" y="988" font-size="12" fill="#5F5E5A">fabric is sized for</text>

  <!-- Legend -->
  <g>
    <line x1="100" y1="1136" x2="160" y2="1136" stroke="#E67E22" stroke-width="4" marker-start="url(#ao)" marker-end="url(#ao)"/>
    <text x="175" y="1141" font-size="13" fill="#2C2C2A">NVLink (intra-node)</text>
    <line x1="400" y1="1136" x2="460" y2="1136" stroke="#1F3B5C" stroke-width="4" marker-start="url(#an)" marker-end="url(#an)"/>
    <text x="475" y="1141" font-size="13" fill="#2C2C2A">Network / fabric (inter-node)</text>
  </g>
</svg>
