<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="an" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3B5C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="400" fill="#ffffff"/>
  <text x="40" y="36" font-size="20" font-weight="bold" fill="#2C2C2A">Gather &#8212; every rank's chunk is collected onto the root only, ordered by rank</text>

  <!-- input columns: rank i holds chunk i -->
  <g>
    <rect x="110" y="90" width="78" height="40" fill="#57A64A"/>
    <rect x="110" y="134" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="110" y="178" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="110" y="222" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="205" y="90" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="205" y="134" width="78" height="40" fill="#E05C7A"/>
    <rect x="205" y="178" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="205" y="222" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="300" y="90" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="300" y="134" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="300" y="178" width="78" height="40" fill="#E67E22"/>
    <rect x="300" y="222" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="395" y="90" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="395" y="134" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="395" y="178" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="395" y="222" width="78" height="40" fill="#3A7BD5"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="149" y="115">A</text>
    <text x="244" y="159">B</text>
    <text x="339" y="203">C</text>
    <text x="434" y="247">D</text>
  </g>
  <g font-size="11" fill="#5F5E5A" text-anchor="middle">
    <text x="149" y="285">GPU0 (root)</text>
    <text x="244" y="285">GPU1</text>
    <text x="339" y="285">GPU2</text>
    <text x="434" y="285">GPU3</text>
  </g>

  <line x1="505" y1="180" x2="588" y2="180" stroke="#1F3B5C" stroke-width="4" marker-end="url(#an)"/>
  <text x="548" y="160" font-size="12" font-weight="bold" fill="#1F3B5C" text-anchor="middle">Gather</text>

  <!-- output columns: the root has everything; the others still hold only their own chunk -->
  <g>
    <rect x="620" y="90" width="78" height="40" fill="#57A64A" stroke="#8A8880" stroke-width="0.8"/>
    <rect x="620" y="134" width="78" height="40" fill="#E05C7A" stroke="#8A8880" stroke-width="0.8"/>
    <rect x="620" y="178" width="78" height="40" fill="#E67E22" stroke="#8A8880" stroke-width="0.8"/>
    <rect x="620" y="222" width="78" height="40" fill="#3A7BD5" stroke="#8A8880" stroke-width="0.8"/>
    <rect x="715" y="90" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="715" y="134" width="78" height="40" fill="#E05C7A"/>
    <rect x="715" y="178" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="715" y="222" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="810" y="90" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="810" y="134" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="810" y="178" width="78" height="40" fill="#E67E22"/>
    <rect x="810" y="222" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="905" y="90" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="905" y="134" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="905" y="178" width="78" height="40" fill="none" stroke="#C9C7BF" stroke-dasharray="4 3"/>
    <rect x="905" y="222" width="78" height="40" fill="#3A7BD5"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="659" y="115">A</text><text x="659" y="159">B</text><text x="659" y="203">C</text><text x="659" y="247">D</text>
    <text x="754" y="159">B</text>
    <text x="849" y="203">C</text>
    <text x="944" y="247">D</text>
  </g>
  <g font-size="11" fill="#5F5E5A" text-anchor="middle">
    <text x="659" y="285">GPU0 (root)</text>
    <text x="754" y="285">GPU1</text>
    <text x="849" y="285">GPU2</text>
    <text x="944" y="285">GPU3</text>
  </g>

  <text x="40" y="330" font-size="12" fill="#5F5E5A">No arithmetic &#8212; the root receives the rank-ordered concatenation (P&#215;N&#215;S on the root only); the other ranks keep just their own chunk.</text>
  <text x="40" y="352" font-size="12" fill="#5F5E5A">The one-destination cousin of AllGather &#8212; e.g. pulling scattered eval results onto one card. Native ncclGather since NCCL 2.28.</text>
</svg>
