<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="780" viewBox="0 0 1080 780" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="an" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3B5C"/>
    </marker>
    <marker id="ag" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8880"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="780" fill="#ffffff"/>
  <text x="40" y="36" font-size="20" font-weight="bold" fill="#2C2C2A">From ranks to a running collective &#8212; the vocabulary of section 3 in one picture</text>
  <text x="40" y="58" font-size="12" fill="#5F5E5A">rank &#8594; communicator &#8594; collective; then what makes it go (bootstrap, streams, channels) and the contract that must hold</text>

  <!-- ================= Row 1: rank -> communicator -> collective ================= -->

  <!-- 3.1 Rank -->
  <rect x="40" y="84" width="290" height="220" rx="12" fill="#F7F7F5" stroke="#C9C7BF"/>
  <text x="56" y="108" font-size="13" font-weight="bold" fill="#1F3B5C">3.1 Rank</text>
  <text x="56" y="126" font-size="11" fill="#5F5E5A">one process &#8596; one GPU &#8596; one rank (0 &#8230; P&#8722;1)</text>
  <g>
    <rect x="60" y="142" width="58" height="40" rx="6" fill="#E8EEF6" stroke="#1F3B5C"/>
    <rect x="128" y="142" width="58" height="40" rx="6" fill="#E8EEF6" stroke="#1F3B5C"/>
    <rect x="196" y="142" width="58" height="40" rx="6" fill="#E8EEF6" stroke="#1F3B5C"/>
    <rect x="264" y="142" width="58" height="40" rx="6" fill="#E8EEF6" stroke="#1F3B5C"/>
  </g>
  <g font-size="10" fill="#5F5E5A" text-anchor="middle">
    <text x="89" y="156">proc 0</text><text x="157" y="156">proc 1</text><text x="225" y="156">proc 2</text><text x="293" y="156">proc 3</text>
  </g>
  <g font-size="10" fill="#5F5E5A" text-anchor="middle">
    <text x="89" y="173">GPU0</text><text x="157" y="173">GPU1</text><text x="225" y="173">GPU2</text><text x="293" y="173">GPU3</text>
  </g>
  <g stroke="#4A4A46" stroke-width="1.5" fill="#ffffff">
    <circle cx="89" cy="210" r="13"/><circle cx="157" cy="210" r="13"/><circle cx="225" cy="210" r="13"/><circle cx="293" cy="210" r="13"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2C2C2A" text-anchor="middle">
    <text x="89" y="214">0</text><text x="157" y="214">1</text><text x="225" y="214">2</text><text x="293" y="214">3</text>
  </g>
  <g stroke="#8A8880" stroke-width="1" stroke-dasharray="3 2">
    <line x1="89" y1="182" x2="89" y2="197"/><line x1="157" y1="182" x2="157" y2="197"/><line x1="225" y1="182" x2="225" y2="197"/><line x1="293" y1="182" x2="293" y2="197"/>
  </g>
  <text x="56" y="248" font-size="10.5" fill="#5F5E5A">three numberings, equal in simple DP, different</text>
  <text x="56" y="263" font-size="10.5" fill="#5F5E5A">once sub-groups exist:</text>
  <text x="56" y="281" font-size="10.5" fill="#2C2C2A">global rank (job) &#183; local rank (node) &#183; NCCL rank (comm)</text>

  <!-- 3.4 bootstrap arrow between rank and communicator -->
  <line x1="336" y1="190" x2="388" y2="190" stroke="#1F3B5C" stroke-width="3" marker-end="url(#an)"/>
  <text x="362" y="320" font-size="10.5" font-weight="bold" fill="#1F3B5C" text-anchor="middle">3.4 Unique ID + bootstrap</text>
  <text x="362" y="334" font-size="10" fill="#5F5E5A" text-anchor="middle">ncclGetUniqueId() on one rank</text>
  <text x="362" y="347" font-size="10" fill="#5F5E5A" text-anchor="middle">&#8594; out-of-band: MPI / TCP / Store</text>
  <text x="362" y="360" font-size="10" fill="#5F5E5A" text-anchor="middle">&#8594; ncclCommInitRank() &#215; P</text>
  <line x1="362" y1="306" x2="362" y2="296" stroke="#8A8880" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="362" y1="296" x2="362" y2="198" stroke="#8A8880" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- 3.2 Communicator -->
  <rect x="394" y="84" width="290" height="220" rx="12" fill="#F7F7F5" stroke="#C9C7BF"/>
  <text x="410" y="108" font-size="13" font-weight="bold" fill="#1F3B5C">3.2 Communicator</text>
  <text x="410" y="126" font-size="11" fill="#5F5E5A">a fixed membership list plus everything NCCL built for it</text>
  <rect x="414" y="140" width="250" height="96" rx="10" fill="#E8EEF6" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="424" y="157" font-size="11" font-weight="bold" fill="#1F3B5C">comm</text>
  <g stroke="#4A4A46" stroke-width="1.5" fill="#ffffff">
    <circle cx="454" cy="195" r="13"/><circle cx="500" cy="195" r="13"/><circle cx="546" cy="195" r="13"/><circle cx="592" cy="195" r="13"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2C2C2A" text-anchor="middle">
    <text x="454" y="199">0</text><text x="500" y="199">1</text><text x="546" y="199">2</text><text x="592" y="199">3</text>
  </g>
  <g stroke="#1F3B5C" stroke-width="1.2">
    <line x1="467" y1="195" x2="487" y2="195"/><line x1="513" y1="195" x2="533" y2="195"/><line x1="559" y1="195" x2="579" y2="195"/>
  </g>
  <text x="639" y="199" font-size="10" fill="#5F5E5A" text-anchor="middle">nranks = 4</text>
  <text x="424" y="226" font-size="10" fill="#5F5E5A">topology &#183; connections &#183; channels &#183; algorithms &#183; state</text>
  <text x="410" y="258" font-size="10.5" fill="#5F5E5A">membership fixed at init; communicators are independent;</text>
  <text x="410" y="273" font-size="10.5" fill="#5F5E5A">one process holds several at once (DP, TP, PP &#8230;)</text>
  <text x="410" y="291" font-size="10.5" fill="#2C2C2A">ncclCommInitRank &#183; ncclCommInitAll &#183; ncclCommInitRankConfig</text>

  <!-- arrow communicator -> collective -->
  <line x1="690" y1="190" x2="742" y2="190" stroke="#1F3B5C" stroke-width="3" marker-end="url(#an)"/>
  <text x="716" y="178" font-size="10" fill="#5F5E5A" text-anchor="middle">issue</text>

  <!-- 3.3 Collective -->
  <rect x="748" y="84" width="292" height="220" rx="12" fill="#F7F7F5" stroke="#C9C7BF"/>
  <text x="764" y="108" font-size="13" font-weight="bold" fill="#1F3B5C">3.3 Collective</text>
  <text x="764" y="126" font-size="11" fill="#5F5E5A">every rank calls; complete only when all have</text>
  <g stroke="#4A4A46" stroke-width="1.5" fill="#ffffff">
    <circle cx="792" cy="158" r="13"/><circle cx="858" cy="158" r="13"/><circle cx="924" cy="158" r="13"/><circle cx="990" cy="158" r="13"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2C2C2A" text-anchor="middle">
    <text x="792" y="162">0</text><text x="858" y="162">1</text><text x="924" y="162">2</text><text x="990" y="162">3</text>
  </g>
  <g stroke="#1F3B5C" stroke-width="2" marker-end="url(#an)">
    <line x1="796" y1="173" x2="866" y2="213"/>
    <line x1="860" y1="173" x2="880" y2="213"/>
    <line x1="922" y1="173" x2="902" y2="213"/>
    <line x1="986" y1="173" x2="916" y2="213"/>
  </g>
  <rect x="782" y="218" width="224" height="34" rx="8" fill="#1F3B5C"/>
  <text x="894" y="240" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ncclAllReduce(&#8230;, comm, stream)</text>
  <text x="764" y="272" font-size="10.5" fill="#5F5E5A">one collective = P calls, one per rank, on each rank's own</text>
  <text x="764" y="287" font-size="10.5" fill="#5F5E5A">stream; a rank that never calls stalls all the others.</text>
  <text x="764" y="301" font-size="10.5" fill="#5F5E5A">Contrast: Send/Recv involves exactly two ranks.</text>

  <!-- ================= Row 2: stream + channels ================= -->

  <!-- 3.5 CUDA stream -->
  <rect x="40" y="384" width="500" height="220" rx="12" fill="#F7F7F5" stroke="#C9C7BF"/>
  <text x="56" y="408" font-size="13" font-weight="bold" fill="#1F3B5C">3.5 CUDA stream &#8212; enqueued is not finished</text>
  <text x="56" y="426" font-size="11" fill="#5F5E5A">what one rank's call actually does</text>

  <text x="56" y="456" font-size="10.5" font-weight="bold" fill="#2C2C2A">CPU</text>
  <rect x="96" y="442" width="118" height="22" rx="4" fill="#E8EEF6" stroke="#1F3B5C"/>
  <text x="155" y="457" font-size="10" fill="#1F3B5C" text-anchor="middle">ncclAllReduce(&#8230;)</text>
  <text x="222" y="457" font-size="10" fill="#5F5E5A">returns immediately &#8594; CPU carries on</text>

  <line x1="155" y1="466" x2="155" y2="494" stroke="#8A8880" stroke-width="1.2" marker-end="url(#ag)" stroke-dasharray="3 2"/>
  <text x="160" y="486" font-size="9.5" fill="#8A8880">enqueue</text>

  <text x="56" y="514" font-size="10.5" font-weight="bold" fill="#2C2C2A">stream</text>
  <line x1="96" y1="510" x2="520" y2="510" stroke="#8A8880" stroke-width="1"/>
  <rect x="100" y="498" width="96" height="24" rx="4" fill="#CBE6C0" stroke="#57A64A"/>
  <text x="148" y="514" font-size="10" fill="#2C2C2A" text-anchor="middle">prior compute</text>
  <rect x="200" y="498" width="150" height="24" rx="4" fill="#1F3B5C"/>
  <text x="275" y="514" font-size="10" fill="#ffffff" text-anchor="middle">AllReduce kernel / transfer</text>
  <rect x="354" y="498" width="110" height="24" rx="4" fill="#F2C4CE" stroke="#E05C7A"/>
  <text x="409" y="514" font-size="10" fill="#2C2C2A" text-anchor="middle">dependent op</text>
  <line x1="350" y1="528" x2="350" y2="548" stroke="#E05C7A" stroke-width="1.5"/>
  <text x="350" y="562" font-size="10" fill="#E05C7A" text-anchor="middle">data is only valid here</text>

  <text x="56" y="590" font-size="10.5" fill="#5F5E5A">to know it finished: cudaStreamSynchronize, a CUDA event recorded after it, or the framework's Work / Future.</text>

  <!-- 3.6 Channels -->
  <rect x="580" y="384" width="460" height="220" rx="12" fill="#F7F7F5" stroke="#C9C7BF"/>
  <text x="596" y="408" font-size="13" font-weight="bold" fill="#1F3B5C">3.6 Channels &#8212; one operation, several parallel pipelines</text>
  <text x="596" y="426" font-size="11" fill="#5F5E5A">inside the collective NCCL splits the work into lanes</text>

  <rect x="600" y="440" width="116" height="110" rx="8" fill="#1F3B5C"/>
  <text x="658" y="485" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">AllReduce</text>
  <text x="658" y="500" font-size="10" fill="#ffffff" text-anchor="middle">on comm</text>
  <text x="658" y="515" font-size="10" fill="#ffffff" text-anchor="middle">(chunked)</text>

  <g stroke="#1F3B5C" stroke-width="2" marker-end="url(#an)">
    <line x1="720" y1="470" x2="752" y2="458"/>
    <line x1="720" y1="495" x2="752" y2="495"/>
    <line x1="720" y1="520" x2="752" y2="532"/>
  </g>
  <g stroke="#8A8880" stroke-width="1">
    <rect x="758" y="446" width="270" height="24" rx="4" fill="#E8EEF6"/>
    <rect x="758" y="483" width="270" height="24" rx="4" fill="#E8EEF6"/>
    <rect x="758" y="520" width="270" height="24" rx="4" fill="#E8EEF6"/>
  </g>
  <g font-size="10" fill="#2C2C2A">
    <text x="766" y="462">channel 0 &#183; own rank order, peers, work queue</text>
    <text x="766" y="499">channel 1 &#183; own rank order, peers, work queue</text>
    <text x="766" y="536">channel 2 &#183; &#8230; (count chosen by NCCL)</text>
  </g>
  <text x="596" y="574" font-size="10.5" fill="#5F5E5A">too few channels &#8594; links sit idle; too many &#8594; kernel, sync, buffer and connection overhead.</text>
  <text x="596" y="590" font-size="10.5" fill="#5F5E5A">NCCL_MIN/MAX_NCHANNELS are for experiments, not for pinning in production.</text>

  <!-- ================= Row 3: hard contract ================= -->
  <rect x="40" y="636" width="1000" height="112" rx="12" fill="#FDF3E7" stroke="#E67E22" stroke-width="1.5"/>
  <text x="56" y="660" font-size="13" font-weight="bold" fill="#B9770E">3.7 The hard contract &#8212; what every rank must agree on for a collective to complete</text>
  <g font-size="11" fill="#2C2C2A">
    <text x="56" y="686">&#10003; the same collective</text>
    <text x="236" y="686">&#10003; the same element count</text>
    <text x="446" y="686">&#10003; the same datatype (and root)</text>
    <text x="686" y="686">&#10003; the same issue order</text>
    <text x="876" y="686">&#10003; every rank enters</text>
  </g>
  <text x="56" y="712" font-size="11" fill="#C62828">Violate any of these and the behavior is undefined: a hang, a crash, or silently wrong numbers.</text>
  <text x="56" y="732" font-size="11" fill="#5F5E5A">When a job freezes "in communication", check this contract before touching any network counter or tuning knob.</text>
</svg>
