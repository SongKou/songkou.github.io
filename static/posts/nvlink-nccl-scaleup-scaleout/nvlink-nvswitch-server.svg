<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="40" font-size="22" font-weight="bold" fill="#2C2C2A">NVLink 900 GB/s &#8212; the Scale-Up domain inside one H100 SXM server</text>
  <text x="40" y="64" font-size="13" fill="#5F5E5A">8 GPUs in a full crossbar through 4 NVSwitch chips &#8212; GPU&#8596;GPU traffic never touches PCIe, the NICs, or any switch you manage</text>

  <!-- Chassis -->
  <rect x="60" y="90" width="880" height="480" rx="14" fill="#F5F5F3" stroke="#8A8880" stroke-width="2.5"/>

  <!-- NVLink links (drawn first, under the boxes) -->
  <g stroke="#E67E22" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
    <line x1="260" y1="160" x2="405" y2="252"/>
    <line x1="260" y1="160" x2="405" y2="347"/>
    <line x1="260" y1="265" x2="405" y2="252"/>
    <line x1="260" y1="265" x2="405" y2="347"/>
    <line x1="260" y1="370" x2="405" y2="252"/>
    <line x1="260" y1="370" x2="405" y2="347"/>
    <line x1="260" y1="475" x2="405" y2="252"/>
    <line x1="260" y1="475" x2="405" y2="347"/>
    <line x1="740" y1="160" x2="595" y2="252"/>
    <line x1="740" y1="160" x2="595" y2="347"/>
    <line x1="740" y1="265" x2="595" y2="252"/>
    <line x1="740" y1="265" x2="595" y2="347"/>
    <line x1="740" y1="370" x2="595" y2="252"/>
    <line x1="740" y1="370" x2="595" y2="347"/>
    <line x1="740" y1="475" x2="595" y2="252"/>
    <line x1="740" y1="475" x2="595" y2="347"/>
  </g>

  <!-- GPUs left column -->
  <g>
    <rect x="110" y="120" width="150" height="80" rx="8" fill="#0C447C"/>
    <text x="185" y="168" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU0</text>
    <rect x="110" y="225" width="150" height="80" rx="8" fill="#0C447C"/>
    <text x="185" y="273" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU1</text>
    <rect x="110" y="330" width="150" height="80" rx="8" fill="#0C447C"/>
    <text x="185" y="378" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU2</text>
    <rect x="110" y="435" width="150" height="80" rx="8" fill="#0C447C"/>
    <text x="185" y="483" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU3</text>
  </g>

  <!-- GPUs right column -->
  <g>
    <rect x="740" y="120" width="150" height="80" rx="8" fill="#0C447C"/>
    <text x="815" y="168" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU4</text>
    <rect x="740" y="225" width="150" height="80" rx="8" fill="#0C447C"/>
    <text x="815" y="273" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU5</text>
    <rect x="740" y="330" width="150" height="80" rx="8" fill="#0C447C"/>
    <text x="815" y="378" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU6</text>
    <rect x="740" y="435" width="150" height="80" rx="8" fill="#0C447C"/>
    <text x="815" y="483" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU7</text>
  </g>

  <!-- NVSwitch group -->
  <rect x="395" y="210" width="180" height="190" rx="10" fill="none" stroke="#B9770E" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="485" y="200" font-size="13" font-weight="bold" fill="#B9770E" text-anchor="middle">4 &#215; NVSwitch</text>
  <g>
    <rect x="405" y="225" width="75" height="55" rx="6" fill="#E67E22"/>
    <text x="442" y="257" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">NVSwitch</text>
    <rect x="490" y="225" width="75" height="55" rx="6" fill="#E67E22"/>
    <text x="527" y="257" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">NVSwitch</text>
    <rect x="405" y="320" width="75" height="55" rx="6" fill="#E67E22"/>
    <text x="442" y="352" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">NVSwitch</text>
    <rect x="490" y="320" width="75" height="55" rx="6" fill="#E67E22"/>
    <text x="527" y="352" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">NVSwitch</text>
  </g>
  <text x="500" y="547" font-size="12" font-style="italic" fill="#5F5E5A" text-anchor="middle">any two GPUs: full-bandwidth NVLink path, non-blocking &#8212; congestion effectively does not exist in here</text>

  <!-- NIC wall -->
  <g fill="#4A4A46">
    <rect x="900" y="120" width="28" height="20" rx="3"/>
    <rect x="900" y="175" width="28" height="20" rx="3"/>
    <rect x="900" y="230" width="28" height="20" rx="3"/>
    <rect x="900" y="285" width="28" height="20" rx="3"/>
    <rect x="900" y="340" width="28" height="20" rx="3"/>
    <rect x="900" y="395" width="28" height="20" rx="3"/>
    <rect x="900" y="450" width="28" height="20" rx="3"/>
    <rect x="900" y="505" width="28" height="20" rx="3"/>
  </g>
  <g stroke="#8A8880" stroke-width="2">
    <line x1="928" y1="130" x2="1010" y2="130"/>
    <line x1="928" y1="185" x2="1010" y2="185"/>
    <line x1="928" y1="240" x2="1010" y2="240"/>
    <line x1="928" y1="295" x2="1010" y2="295"/>
    <line x1="928" y1="350" x2="1010" y2="350"/>
    <line x1="928" y1="405" x2="1010" y2="405"/>
    <line x1="928" y1="460" x2="1010" y2="460"/>
    <line x1="928" y1="515" x2="1010" y2="515"/>
  </g>
  <text x="1022" y="290" font-size="14" font-weight="bold" fill="#2C2C2A">8 &#215; ConnectX-7</text>
  <text x="1022" y="310" font-size="12" fill="#5F5E5A">one NIC per GPU (PCIe),</text>
  <text x="1022" y="328" font-size="12" fill="#5F5E5A">used only when traffic</text>
  <text x="1022" y="346" font-size="12" fill="#5F5E5A">must leave the server &#8212;</text>
  <text x="1022" y="364" font-size="12" fill="#5F5E5A">the Scale-Out boundary</text>

  <!-- Caption -->
  <text x="40" y="612" font-size="12" fill="#5F5E5A">Bandwidth figure = bidirectional aggregate per GPU (NVLink 4.0, 18 links). Each GPU has NVLink ports into all four NVSwitch chips; two lines per GPU are drawn here to keep the crossbar readable.</text>
</svg>
