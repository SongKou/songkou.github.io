<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Layer 3 redesign: the switch becomes a last-hop multicast router with separate routed links to R2 and R3</title>
  <desc id="desc">A sender connects through R1, the rendezvous point, to routers R2 and R3. R2 and R3 each connect over a separate routed link to a Layer 3 last-hop router, which connects to the receiver. Red arrows show that the router's RPF/ECMP selection sends different (S,G) trees via R2 or R3, one path per tree.</desc>
  <defs>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#14233b" flood-opacity=".13"/>
    </filter>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#e5484d"/>
    </marker>
    <style>
      .link { fill: none; stroke: #65758b; stroke-width: 4; stroke-linecap: round; }
      .routed { fill: none; stroke: #65758b; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 2 10; }
      .possible { fill: none; stroke: #e5484d; stroke-width: 7; stroke-linecap: round; marker-end: url(#arrowRed); }
      .node { fill: url(#nodeFill); stroke: #26364d; stroke-width: 3; rx: 14; filter: url(#shadow); }
      .label { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 28px; font-weight: 650; fill: #17233a; text-anchor: middle; }
      .sub { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 20px; fill: #536176; text-anchor: middle; }
      .caption { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 21px; fill: #bf3038; font-weight: 650; text-anchor: middle; }
      .title { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 34px; font-weight: 750; fill: #17233a; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="1000" fill="#f8fafc"/>
  <text x="600" y="52" class="title">Layer 3 Redesign: Separate Routed Links to R2 and R3</text>
  <text x="600" y="82" class="sub">Red spread shown with multicast multipath enabled — it is not the default</text>

  <!-- Underlay and routed links -->
  <path class="link" d="M 825 150 C 760 170, 700 192, 645 220"/>
  <path class="link" d="M 550 300 C 490 350, 375 390, 305 445"/>
  <path class="link" d="M 650 300 C 700 355, 795 390, 865 445"/>
  <!-- separate routed links from R2/R3 down to the L3 router (dashed = distinct subnets, not a shared LAN) -->
  <path class="routed" d="M 305 535 C 360 610, 430 652, 505 705"/>
  <path class="routed" d="M 865 535 C 810 610, 738 652, 645 705"/>
  <path class="link" d="M 575 805 L 575 862"/>

  <!-- Nodes -->
  <rect class="node" x="825" y="95" width="265" height="110"/>
  <text class="label" x="957.5" y="145">Sender</text>
  <text class="sub" x="957.5" y="176">multicast source S</text>

  <rect class="node" x="455" y="210" width="290" height="100"/>
  <text class="label" x="600" y="252">R1</text>
  <text class="sub" x="600" y="282">Rendezvous Point (RP)</text>

  <rect class="node" x="175" y="435" width="260" height="110"/>
  <text class="label" x="305" y="480">R2</text>
  <text class="sub" x="305" y="512">PIM router</text>

  <rect class="node" x="735" y="435" width="260" height="110"/>
  <text class="label" x="865" y="480">R3</text>
  <text class="sub" x="865" y="512">PIM router</text>

  <rect class="node" x="415" y="695" width="320" height="110"/>
  <text class="label" x="575" y="738">L3 router</text>
  <text class="sub" x="575" y="770">last-hop · RPF + ECMP</text>

  <rect class="node" x="445" y="865" width="260" height="100"/>
  <text class="label" x="575" y="907">Receiver</text>
  <text class="sub" x="575" y="938">IGMP host</text>

  <!-- Emphasis: different (S,G) trees resolve to different upstreams -->
  <path class="possible" d="M 505 700 C 435 652, 358 614, 315 552"/>
  <path class="possible" d="M 645 700 C 715 652, 792 614, 855 552"/>
  <text class="caption" x="300" y="645">(S1,G1) via R2</text>
  <text class="caption" x="885" y="645">(S2,G2) via R3</text>

  <!-- Bottom note: default vs. enabled -->
  <text class="sub" x="600" y="974">Default (do nothing): every tree uses one upstream — the highest-IP neighbor. Per-(S,G) spreading is opt-in.</text>
  <text class="sub" x="600" y="996">Each stream still rides one path; RPF / ECMP — not PIM Assert — selects it.</text>
</svg>
