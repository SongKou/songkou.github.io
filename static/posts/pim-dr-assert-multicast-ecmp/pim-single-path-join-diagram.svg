<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Receiver-driven join: R4 joins toward one upstream and only that branch carries the group</title>
  <desc id="desc">A sender connects through R1 (RP) to R2 and R3, which each connect over a separate link to R4, the last-hop router for the receiver. R4 sends its join toward one upstream (R2 via Link1). The active path Sender to R1 to R2 to R4 to Receiver is highlighted; R3 and Link2 receive no join and stay idle. R2 and R3 share no segment, so there is no DR election between them and PIM Assert never fires.</desc>
  <defs>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#14233b" flood-opacity=".13"/>
    </filter>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#2f9e44"/>
    </marker>
    <style>
      .idle { fill: none; stroke: #c1c8d1; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 3 11; }
      .active { fill: none; stroke: #2f9e44; stroke-width: 7; stroke-linecap: round; marker-end: url(#arrowGreen); }
      .node { fill: url(#nodeFill); stroke: #26364d; stroke-width: 3; rx: 14; filter: url(#shadow); }
      .nodeMuted { fill: #f3f5f8; stroke: #b6bdc8; stroke-width: 3; rx: 14; }
      .label { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 28px; font-weight: 650; fill: #17233a; text-anchor: middle; }
      .labelMuted { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 28px; font-weight: 650; fill: #8b95a4; text-anchor: middle; }
      .sub { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 20px; fill: #536176; text-anchor: middle; }
      .subMuted { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 20px; fill: #98a2b1; text-anchor: middle; }
      .greenCap { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 21px; fill: #2b8a3e; font-weight: 650; text-anchor: middle; }
      .greyCap { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 21px; fill: #868e9a; font-weight: 650; text-anchor: middle; }
      .title { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 33px; font-weight: 750; fill: #17233a; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="1000" fill="#f8fafc"/>
  <text x="600" y="52" class="title">Receiver-Driven Join: Traffic Follows the Joined Branch</text>
  <text x="600" y="82" class="sub">R4 joins toward one upstream; R1 forwards only down that branch — not down every equal-cost path</text>

  <!-- Idle path (no join) -->
  <path class="idle" d="M 650 300 C 700 355, 795 390, 865 445"/>
  <path class="idle" d="M 865 535 C 810 610, 738 652, 648 700"/>

  <!-- Active path (the built tree), arrows pointing downstream toward the receiver -->
  <path class="active" d="M 825 150 C 760 170, 700 192, 650 216"/>
  <path class="active" d="M 548 305 C 486 352, 372 392, 306 438"/>
  <path class="active" d="M 305 545 C 360 612, 432 652, 508 700"/>
  <path class="active" d="M 575 805 L 575 858"/>

  <!-- Nodes -->
  <rect class="node" x="825" y="95" width="265" height="110"/>
  <text class="label" x="957.5" y="145">Sender</text>
  <text class="sub" x="957.5" y="176">multicast source S</text>

  <rect class="node" x="455" y="210" width="290" height="100"/>
  <text class="label" x="600" y="250">R1 (RP)</text>
  <text class="sub" x="600" y="280">+ first-hop DR</text>

  <rect class="node" x="175" y="435" width="260" height="110"/>
  <text class="label" x="305" y="478">R2</text>
  <text class="sub" x="305" y="510">on the built tree</text>

  <rect class="nodeMuted" x="735" y="435" width="260" height="110"/>
  <text class="labelMuted" x="865" y="478">R3</text>
  <text class="subMuted" x="865" y="510">no join → idle</text>

  <rect class="node" x="415" y="695" width="320" height="110"/>
  <text class="label" x="575" y="738">R4</text>
  <text class="sub" x="575" y="770">last-hop DR · does the RPF</text>

  <rect class="node" x="445" y="865" width="260" height="100"/>
  <text class="label" x="575" y="907">Receiver</text>
  <text class="sub" x="575" y="938">IGMP host</text>

  <!-- Link labels -->
  <text class="greenCap" x="352" y="628">Link1 (joined)</text>
  <text class="greyCap" x="812" y="628">Link2 (idle)</text>

  <!-- Bottom note -->
  <text class="sub" x="600" y="974">R4's RPF selects one upstream (R2, highest IP by default) and joins toward it; multicast is pulled by that join, so R1's outgoing list holds only the R2 branch.</text>
  <text class="sub" x="600" y="996">R2 and R3 share no segment — no DR election between them — and no wire ever carries two copies, so PIM Assert never fires.</text>
</svg>
