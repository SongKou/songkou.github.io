<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Multicast ECMP: two trees, two upstream selections</title>
  <desc id="desc">A diamond topology from Source S through R0, over equal-cost routers R1 and R2, to R3 and a receiver. Left panel: for (S,G1) R3 selects R1 — the Join travels R3 to R1 to R0 and data flows back R0, R1, R3, receiver. Right panel: for (S,G2) R3 selects R2, so both uplinks carry traffic, one tree each.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.node{fill:#eef6ff;stroke:#7c9bbd;stroke-width:2}.label{font:600 19px Arial,sans-serif;fill:#17212b;text-anchor:middle}.sub{font:15px Arial,sans-serif;fill:#506070;text-anchor:middle}.step{font:600 17px Arial,sans-serif;fill:#17212b}.detail{font:15px Arial,sans-serif;fill:#506070}.line{stroke:#d2dbe5;stroke-width:3;fill:none}.data{stroke:#138a5b;stroke-width:5;fill:none}.join{stroke:#1677c8;stroke-width:3.5;fill:none;stroke-dasharray:8 6}.phase{font:600 18px Arial,sans-serif;fill:#17212b}.divider{stroke:#e3e9f0;stroke-width:2}.key{font:14px Arial,sans-serif;fill:#506070}
    </style>
    <marker id="data-arrow" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L14 6L0 12Z" fill="#138a5b"/></marker>
    <marker id="join-arrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L12 5L0 10Z" fill="#1677c8"/></marker>
  </defs>
  <rect class="bg" width="1200" height="610"/>
  <text x="50" y="38" class="phase">Multicast ECMP — each tree picks one upstream; different trees can pick different ones</text>
  <line x1="50" y1="62" x2="85" y2="62" class="data"/><text x="93" y="67" class="key">multicast data (down the tree)</text>
  <line x1="350" y1="62" x2="385" y2="62" class="join"/><text x="393" y="67" class="key">PIM (S,G) Join, hop-by-hop</text>
  <line x1="620" y1="62" x2="655" y2="62" class="line"/><text x="663" y="67" class="key">equal-cost candidate not selected for this tree</text>

  <!-- Panel 1: (S,G1) via R1 -->
  <text x="60" y="110" class="step">(S,G1) — R3’s hash selects R1</text>
  <path class="line" d="M300 150V235M300 235L185 325M300 235L415 325M185 325L300 415M415 325L300 415M300 415V495"/>
  <path class="data" marker-end="url(#data-arrow)" d="M300 174V209"/>
  <path class="data" marker-end="url(#data-arrow)" d="M271 257L214 302"/>
  <path class="data" marker-end="url(#data-arrow)" d="M214 347L271 392"/>
  <path class="data" marker-end="url(#data-arrow)" d="M300 438V472"/>
  <path class="join" marker-end="url(#join-arrow)" d="M250 412Q195 400 180 352"/>
  <path class="join" marker-end="url(#join-arrow)" d="M168 300Q160 248 242 247"/>
  <text class="sub" x="445" y="375">not selected for G1</text>
  <rect class="node" x="235" y="129" width="130" height="42" rx="9"/><text class="label" x="300" y="156">Source S</text>
  <rect class="node" x="250" y="214" width="100" height="42" rx="9"/><text class="label" x="300" y="241">R0</text>
  <rect class="node" x="135" y="304" width="100" height="42" rx="9"/><text class="label" x="185" y="331">R1</text>
  <rect class="node" x="365" y="304" width="100" height="42" rx="9"/><text class="label" x="415" y="331">R2</text>
  <rect class="node" x="250" y="394" width="100" height="42" rx="9"/><text class="label" x="300" y="421">R3</text>
  <rect class="node" x="235" y="474" width="130" height="42" rx="9"/><text class="label" x="300" y="501">Receiver</text>

  <line class="divider" x1="600" y1="95" x2="600" y2="530"/>

  <!-- Panel 2: (S,G2) via R2 -->
  <text x="660" y="110" class="step">(S,G2) — R3’s hash selects R2</text>
  <path class="line" d="M900 150V235M900 235L785 325M900 235L1015 325M785 325L900 415M1015 325L900 415M900 415V495"/>
  <path class="data" marker-end="url(#data-arrow)" d="M900 174V209"/>
  <path class="data" marker-end="url(#data-arrow)" d="M929 257L986 302"/>
  <path class="data" marker-end="url(#data-arrow)" d="M986 347L929 392"/>
  <path class="data" marker-end="url(#data-arrow)" d="M900 438V472"/>
  <path class="join" marker-end="url(#join-arrow)" d="M950 412Q1005 400 1020 352"/>
  <path class="join" marker-end="url(#join-arrow)" d="M1032 300Q1040 248 958 247"/>
  <text class="sub" x="755" y="375">not selected for G2</text>
  <rect class="node" x="835" y="129" width="130" height="42" rx="9"/><text class="label" x="900" y="156">Source S</text>
  <rect class="node" x="850" y="214" width="100" height="42" rx="9"/><text class="label" x="900" y="241">R0</text>
  <rect class="node" x="735" y="304" width="100" height="42" rx="9"/><text class="label" x="785" y="331">R1</text>
  <rect class="node" x="965" y="304" width="100" height="42" rx="9"/><text class="label" x="1015" y="331">R2</text>
  <rect class="node" x="850" y="394" width="100" height="42" rx="9"/><text class="label" x="900" y="421">R3</text>
  <rect class="node" x="835" y="474" width="130" height="42" rx="9"/><text class="label" x="900" y="501">Receiver</text>

  <text x="50" y="570" class="step">Both uplinks now carry traffic — one tree each.</text>
  <text x="480" y="570" class="detail">The Join chooses the upstream; the data follows each Join in reverse.</text>
</svg>
