<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect width="1280" height="500" fill="#07111f"/>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter></defs>

  <text x="64" y="60" font-size="30" font-weight="750" fill="#e5eef9">Each RoCE packet is wrapped in VXLAN independently</text>
  <text x="64" y="92" font-size="16" font-weight="450" fill="#9fb0c5">The tunnel never sees the 9,000 B operation &#8212; every path-MTU slice gets its own full encapsulation</text>

  <!-- header stack -->
  <g filter="url(#shadow)">
    <rect x="64" y="150" width="88" height="64" fill="#152944" stroke="#49627e" stroke-width="2"/>
    <text x="108" y="178" text-anchor="middle" font-size="13" font-weight="650" fill="#e5eef9">Outer Eth</text>
    <text x="108" y="200" text-anchor="middle" font-size="12" fill="#9fb0c5">14 B</text>
    <rect x="152" y="150" width="92" height="64" fill="#152944" stroke="#49627e" stroke-width="2"/>
    <text x="198" y="178" text-anchor="middle" font-size="13" font-weight="650" fill="#e5eef9">Outer IPv4</text>
    <text x="198" y="200" text-anchor="middle" font-size="12" fill="#9fb0c5">20 B</text>
    <rect x="244" y="150" width="76" height="64" fill="#152944" stroke="#49627e" stroke-width="2"/>
    <text x="282" y="178" text-anchor="middle" font-size="13" font-weight="650" fill="#e5eef9">UDP</text>
    <text x="282" y="200" text-anchor="middle" font-size="12" fill="#9fb0c5">8 B</text>
    <rect x="320" y="150" width="76" height="64" fill="#2b230f" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="358" y="178" text-anchor="middle" font-size="13" font-weight="650" fill="#fbbf24">VXLAN</text>
    <text x="358" y="200" text-anchor="middle" font-size="12" fill="#9fb0c5">8 B</text>
    <rect x="396" y="150" width="88" height="64" fill="#0d1b2e" stroke="#49627e" stroke-width="2"/>
    <text x="440" y="178" text-anchor="middle" font-size="13" font-weight="650" fill="#9fb0c5">Inner Eth</text>
    <text x="440" y="200" text-anchor="middle" font-size="12" fill="#9fb0c5">14 B</text>
    <rect x="484" y="150" width="92" height="64" fill="#0d1b2e" stroke="#49627e" stroke-width="2"/>
    <text x="530" y="178" text-anchor="middle" font-size="13" font-weight="650" fill="#9fb0c5">Inner IPv4</text>
    <text x="530" y="200" text-anchor="middle" font-size="12" fill="#9fb0c5">20 B</text>
    <rect x="576" y="150" width="76" height="64" fill="#0d1b2e" stroke="#49627e" stroke-width="2"/>
    <text x="614" y="178" text-anchor="middle" font-size="13" font-weight="650" fill="#9fb0c5">UDP 4791</text>
    <text x="614" y="200" text-anchor="middle" font-size="12" fill="#9fb0c5">8 B</text>
    <rect x="652" y="150" width="64" height="64" fill="#0d1b2e" stroke="#49627e" stroke-width="2"/>
    <text x="684" y="178" text-anchor="middle" font-size="13" font-weight="650" fill="#9fb0c5">BTH</text>
    <text x="684" y="200" text-anchor="middle" font-size="12" fill="#9fb0c5">12 B</text>
    <rect x="716" y="150" width="68" height="64" fill="#0d1b2e" stroke="#49627e" stroke-width="2"/>
    <text x="750" y="178" text-anchor="middle" font-size="13" font-weight="650" fill="#9fb0c5">RETH</text>
    <text x="750" y="200" text-anchor="middle" font-size="12" fill="#9fb0c5">16 B</text>
    <rect x="784" y="150" width="376" height="64" fill="#0f2b22" stroke="#34d399" stroke-width="2.5"/>
    <text x="972" y="178" text-anchor="middle" font-size="15" font-weight="650" fill="#34d399">RDMA data</text>
    <text x="972" y="200" text-anchor="middle" font-size="12" fill="#9fb0c5">4,096 B &#8212; one path-MTU slice</text>
    <rect x="1160" y="150" width="56" height="64" fill="#0d1b2e" stroke="#49627e" stroke-width="2"/>
    <text x="1188" y="178" text-anchor="middle" font-size="13" font-weight="650" fill="#9fb0c5">iCRC</text>
    <text x="1188" y="200" text-anchor="middle" font-size="12" fill="#9fb0c5">4 B</text>
  </g>

  <!-- brackets level 1 -->
  <path d="M64,224 v8 H396 v-8" fill="none" stroke="#49627e" stroke-width="2"/>
  <text x="230" y="250" text-anchor="middle" font-size="13" fill="#9fb0c5">tunnel overhead &#8212; +50 B</text>
  <path d="M396,224 v8 H1216 v-8" fill="none" stroke="#49627e" stroke-width="2"/>
  <text x="806" y="250" text-anchor="middle" font-size="13" fill="#9fb0c5">original RoCE frame &#8212; 4,170 B, carried untouched through the underlay</text>

  <!-- bracket level 2 -->
  <path d="M152,264 v8 H1216 v-8" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="684" y="292" text-anchor="middle" font-size="14" font-weight="650" fill="#fbbf24">outer IPv4 packet: 20 + 8 + 8 + 4,170 = 4,206 B</text>

  <!-- MTU track, 1 px = 8 B -->
  <g filter="url(#shadow)">
    <rect x="64" y="322" width="1125" height="32" fill="#0d1b2e" stroke="#49627e" stroke-width="2"/>
    <rect x="64" y="322" width="526" height="32" fill="#0f2b22" stroke="#34d399" stroke-width="2"/>
    <text x="327" y="343" text-anchor="middle" font-size="13" font-weight="650" fill="#34d399">outer IPv4 packet &#8212; 4,206 B</text>
    <text x="1177" y="343" text-anchor="end" font-size="12" fill="#9fb0c5">underlay MTU 9,000 B</text>
  </g>
  <text x="64" y="378" font-size="11" fill="#9fb0c5" opacity=".7">to scale: 1 px = 8 B</text>

  <text x="64" y="410" font-size="15" fill="#9fb0c5">Carrying a complete 9,000 B inner IP packet instead would need &#8776; 9,050 B of underlay L3 MTU, plus VLAN-tag allowance.</text>
  <text x="64" y="436" font-size="15" fill="#9fb0c5">VTEPs are not supposed to fragment (RFC 7348) &#8212; the headroom must exist on every underlay hop, end to end.</text>

  <text x="1216" y="472" text-anchor="end" font-size="14" font-weight="500" fill="#9fb0c5">RoCE QoS Concepts</text>
</svg>
