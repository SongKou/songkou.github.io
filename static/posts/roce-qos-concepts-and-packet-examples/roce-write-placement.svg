<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect width="1280" height="740" fill="#07111f"/>
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#9fb0c5"/></marker>
  </defs>

  <text x="64" y="60" font-size="30" font-weight="750" fill="#e5eef9">Packet-by-packet placement into registered memory</text>
  <text x="64" y="92" font-size="16" font-weight="450" fill="#9fb0c5">No reassembly buffer &#8212; each valid, in-order packet DMAs straight to its final address</text>

  <!-- packets -->
  <g filter="url(#shadow)">
    <rect x="64" y="160" width="420" height="64" fill="#0f2b22" stroke="#34d399" stroke-width="2.5"/>
    <text x="274" y="188" text-anchor="middle" font-size="15" font-weight="650" fill="#34d399">WRITE_FIRST &#183; PSN n</text>
    <text x="274" y="210" text-anchor="middle" font-size="12" fill="#9fb0c5">BTH + RETH + 4,096 B data</text>

    <rect x="64" y="320" width="420" height="64" fill="#0f2b22" stroke="#34d399" stroke-width="2.5"/>
    <text x="274" y="348" text-anchor="middle" font-size="15" font-weight="650" fill="#34d399">WRITE_MIDDLE &#183; PSN n+1</text>
    <text x="274" y="370" text-anchor="middle" font-size="12" fill="#9fb0c5">BTH + 4,096 B data</text>

    <rect x="64" y="480" width="140" height="64" fill="#0f2b22" stroke="#34d399" stroke-width="2.5"/>
    <text x="134" y="508" text-anchor="middle" font-size="14" font-weight="650" fill="#34d399">WRITE_LAST</text>
    <text x="134" y="530" text-anchor="middle" font-size="11" fill="#9fb0c5">PSN n+2 &#183; 808 B</text>
  </g>

  <text x="64" y="250" font-size="13" fill="#9fb0c5">RETH: destination VA, R_Key, total length 9,000 B &#8212; the RNIC latches this context</text>
  <text x="64" y="410" font-size="13" fill="#9fb0c5">no RETH &#8212; the latched context advances the destination address</text>

  <!-- arrows -->
  <path d="M492,192 L864,250" fill="none" stroke="#9fb0c5" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M492,352 L864,459" fill="none" stroke="#9fb0c5" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M212,512 L864,586" fill="none" stroke="#9fb0c5" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- memory bar -->
  <text x="970" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#e5eef9">registered memory &#8212; 9,000 B</text>
  <g filter="url(#shadow)">
    <rect x="880" y="150" width="180" height="209" fill="#0f2b22" stroke="#34d399" stroke-width="2"/>
    <text x="970" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#34d399">bytes 0 &#8230; 4095</text>
    <rect x="880" y="359" width="180" height="209" fill="#0f2b22" stroke="#34d399" stroke-width="2"/>
    <text x="970" y="467" text-anchor="middle" font-size="12" font-weight="600" fill="#34d399">4096 &#8230; 8191</text>
    <rect x="880" y="568" width="180" height="41" fill="#0f2b22" stroke="#34d399" stroke-width="2"/>
    <text x="970" y="593" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399">8192 &#8230; 8999</text>
  </g>
  <g font-size="11" fill="#9fb0c5" text-anchor="end">
    <text x="872" y="156">0</text>
    <text x="872" y="365">4096</text>
    <text x="872" y="574">8192</text>
    <text x="872" y="613">9000</text>
  </g>
  <text x="970" y="640" text-anchor="middle" font-size="13" font-weight="600" fill="#34d399">operation complete only when the Last packet lands</text>

  <text x="64" y="672" font-size="15" fill="#9fb0c5">Placement is progressive and non-atomic: after packet 1 lands, bytes 0&#8211;4,095 may already be visible while 4,096&#8211;8,999 still hold old data.</text>
  <text x="64" y="698" font-size="15" fill="#9fb0c5">If packet 2 is lost, packet 3 is rejected as out-of-sequence and RC retransmits &#8212; but packet 1&#8217;s bytes are not rolled back.</text>

  <text x="1216" y="726" text-anchor="end" font-size="14" font-weight="500" fill="#9fb0c5">RoCE QoS Concepts</text>
</svg>
