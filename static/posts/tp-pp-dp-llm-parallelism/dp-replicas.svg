<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar5" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3B5C"/>
    </marker>
    <marker id="ar5p" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="640" fill="#ffffff"/>
  <text x="40" y="36" font-size="20" font-weight="bold" fill="#2C2C2A">DP &#8212; one model, copied N times: four independent service instances</text>

  <!-- load balancer -->
  <rect x="420" y="62" width="240" height="46" rx="8" fill="#FBEADB" stroke="#E67E22" stroke-width="2"/>
  <text x="540" y="82" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">load balancer</text>
  <text x="540" y="99" font-size="12" fill="#6B6B66" text-anchor="middle">spreads incoming requests</text>

  <!-- arrows to replicas -->
  <g stroke="#1F3B5C" stroke-width="2">
    <line x1="450" y1="108" x2="185" y2="168" marker-end="url(#ar5)"/>
    <line x1="510" y1="108" x2="425" y2="168" marker-end="url(#ar5)"/>
    <line x1="570" y1="108" x2="655" y2="168" marker-end="url(#ar5)"/>
    <line x1="630" y1="108" x2="895" y2="168" marker-end="url(#ar5)"/>
  </g>
  <g font-size="12" fill="#6B6B66">
    <text x="255" y="140">user 1</text>
    <text x="440" y="146">user 2</text>
    <text x="600" y="146">user 3</text>
    <text x="770" y="140">user 4</text>
  </g>

  <!-- four replicas -->
  <g stroke-width="2.5">
    <rect x="70" y="172" width="220" height="188" rx="10" fill="#F0F6FD" stroke="#3A7BD5"/>
    <rect x="320" y="172" width="220" height="188" rx="10" fill="#F1F9EF" stroke="#57A64A"/>
    <rect x="570" y="172" width="220" height="188" rx="10" fill="#FDF3E7" stroke="#E67E22"/>
    <rect x="820" y="172" width="220" height="188" rx="10" fill="#FCEEF2" stroke="#E05C7A"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="180" y="200" fill="#3A7BD5">GPU0</text>
    <text x="430" y="200" fill="#57A64A">GPU1</text>
    <text x="680" y="200" fill="#E67E22">GPU2</text>
    <text x="930" y="200" fill="#E05C7A">GPU3</text>
  </g>

  <!-- model stack inside each replica -->
  <g stroke="#4A4A46" stroke-width="1.2" fill="#ffffff">
    <rect x="95" y="212" width="170" height="30"/>
    <rect x="345" y="212" width="170" height="30"/>
    <rect x="595" y="212" width="170" height="30"/>
    <rect x="845" y="212" width="170" height="30"/>
    <rect x="95" y="250" width="170" height="30"/>
    <rect x="345" y="250" width="170" height="30"/>
    <rect x="595" y="250" width="170" height="30"/>
    <rect x="845" y="250" width="170" height="30"/>
  </g>
  <g font-size="12" fill="#2C2C2A" text-anchor="middle">
    <text x="180" y="231">full 7B model (14 GB)</text>
    <text x="430" y="231">full 7B model (14 GB)</text>
    <text x="680" y="231">full 7B model (14 GB)</text>
    <text x="930" y="231">full 7B model (14 GB)</text>
    <text x="180" y="269">own KV cache</text>
    <text x="430" y="269">own KV cache</text>
    <text x="680" y="269">own KV cache</text>
    <text x="930" y="269">own KV cache</text>
  </g>
  <g font-size="12" fill="#6B6B66" text-anchor="middle">
    <text x="180" y="305">serves its requests</text>
    <text x="430" y="305">serves its requests</text>
    <text x="680" y="305">serves its requests</text>
    <text x="930" y="305">serves its requests</text>
    <text x="180" y="323">start to finish</text>
    <text x="430" y="323">start to finish</text>
    <text x="680" y="323">start to finish</text>
    <text x="930" y="323">start to finish</text>
  </g>
  <g font-size="12.5" font-weight="bold" text-anchor="middle">
    <text x="180" y="348" fill="#3A7BD5">instance 0</text>
    <text x="430" y="348" fill="#57A64A">instance 1</text>
    <text x="680" y="348" fill="#E67E22">instance 2</text>
    <text x="930" y="348" fill="#E05C7A">instance 3</text>
  </g>

  <!-- no traffic between replicas -->
  <g stroke="#B8B8B2" stroke-width="1.8" stroke-dasharray="7,5">
    <line x1="290" y1="266" x2="320" y2="266"/>
    <line x1="540" y1="266" x2="570" y2="266"/>
    <line x1="790" y1="266" x2="820" y2="266"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#C0392B" text-anchor="middle">
    <text x="305" y="256">&#10005;</text>
    <text x="555" y="256">&#10005;</text>
    <text x="805" y="256">&#10005;</text>
  </g>
  <text x="540" y="392" font-size="13" fill="#6B6B66" text-anchor="middle" font-style="italic">no inter-GPU traffic during inference &#8212; replicas are fully independent; throughput &#215;4, per-request latency unchanged</text>

  <!-- training contrast strip -->
  <line x1="40" y1="416" x2="1040" y2="416" stroke="#D8D8D2" stroke-width="1"/>
  <text x="40" y="446" font-size="15" font-weight="bold" fill="#2C2C2A">The same layout in training is NOT free &#8212; replicas must stay identical:</text>

  <g stroke="#4A4A46" stroke-width="1.5" fill="#F7F7F3">
    <rect x="120" y="466" width="150" height="52" rx="6"/>
    <rect x="370" y="466" width="150" height="52" rx="6"/>
    <rect x="620" y="466" width="150" height="52" rx="6"/>
    <rect x="870" y="466" width="150" height="52" rx="6"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#2C2C2A" text-anchor="middle">
    <text x="195" y="488">replica 0</text>
    <text x="445" y="488">replica 1</text>
    <text x="695" y="488">replica 2</text>
    <text x="945" y="488">replica 3</text>
  </g>
  <g font-size="11.5" fill="#6B6B66" text-anchor="middle">
    <text x="195" y="506">local gradients</text>
    <text x="445" y="506">local gradients</text>
    <text x="695" y="506">local gradients</text>
    <text x="945" y="506">local gradients</text>
  </g>
  <!-- gradient ring -->
  <g stroke="#C0392B" stroke-width="2" fill="none">
    <line x1="270" y1="492" x2="362" y2="492" marker-end="url(#ar5p)"/>
    <line x1="520" y1="492" x2="612" y2="492" marker-end="url(#ar5p)"/>
    <line x1="770" y1="492" x2="862" y2="492" marker-end="url(#ar5p)"/>
    <path d="M 945 518 L 945 546 L 195 546 L 195 526" marker-end="url(#ar5p)"/>
  </g>
  <text x="570" y="570" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle">gradient AllReduce, full model size, every training step &#8212; the traffic Scale-Out fabrics are sized for</text>

  <text x="540" y="614" font-size="14" font-weight="bold" fill="#1F3B5C" text-anchor="middle">Inference DP is a load-balancer problem. Training DP is a network problem.</text>
</svg>
