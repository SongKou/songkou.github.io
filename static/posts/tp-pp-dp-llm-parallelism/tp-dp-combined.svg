<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar4" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3B5C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="600" fill="#ffffff"/>
  <text x="40" y="36" font-size="20" font-weight="bold" fill="#2C2C2A">Combining them: a 70B model on 8 GPUs as TP=4 &#215; DP=2</text>

  <!-- load balancer -->
  <rect x="420" y="66" width="240" height="46" rx="8" fill="#FBEADB" stroke="#E67E22" stroke-width="2"/>
  <text x="540" y="88" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">API endpoint / load balancer</text>
  <text x="540" y="105" font-size="12" fill="#6B6B66" text-anchor="middle">routes each request to one replica</text>

  <line x1="480" y1="112" x2="300" y2="160" stroke="#1F3B5C" stroke-width="2" marker-end="url(#ar4)"/>
  <line x1="600" y1="112" x2="780" y2="160" stroke="#1F3B5C" stroke-width="2" marker-end="url(#ar4)"/>
  <text x="330" y="144" font-size="12" fill="#6B6B66">request A</text>
  <text x="690" y="144" font-size="12" fill="#6B6B66">request B</text>

  <!-- Replica 0 -->
  <rect x="70" y="166" width="450" height="270" rx="10" fill="#F7F7F3" stroke="#3A7BD5" stroke-width="2.5"/>
  <text x="90" y="194" font-size="15" font-weight="bold" fill="#3A7BD5">Replica 0 &#8212; one model instance, TP=4</text>

  <!-- GPUs replica 0 -->
  <g stroke="#3A7BD5" stroke-width="2">
    <rect x="100" y="220" width="180" height="80" fill="#E3EDFA"/>
    <rect x="310" y="220" width="180" height="80" fill="#E3EDFA"/>
    <rect x="100" y="330" width="180" height="80" fill="#E3EDFA"/>
    <rect x="310" y="330" width="180" height="80" fill="#E3EDFA"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">
    <text x="190" y="248">GPU0</text>
    <text x="400" y="248">GPU1</text>
    <text x="190" y="358">GPU2</text>
    <text x="400" y="358">GPU3</text>
  </g>
  <g font-size="12" fill="#6B6B66" text-anchor="middle">
    <text x="190" y="268">1/4 of every layer</text>
    <text x="400" y="268">1/4 of every layer</text>
    <text x="190" y="378">1/4 of every layer</text>
    <text x="400" y="378">1/4 of every layer</text>
    <text x="190" y="286">~35 GB weights</text>
    <text x="400" y="286">~35 GB weights</text>
    <text x="190" y="396">~35 GB weights</text>
    <text x="400" y="396">~35 GB weights</text>
  </g>
  <!-- NVLink mesh replica 0 -->
  <g stroke="#E05C7A" stroke-width="1.8" stroke-dasharray="6,4">
    <line x1="280" y1="260" x2="310" y2="260"/>
    <line x1="280" y1="370" x2="310" y2="370"/>
    <line x1="190" y1="300" x2="190" y2="330"/>
    <line x1="400" y1="300" x2="400" y2="330"/>
    <line x1="280" y1="300" x2="310" y2="330"/>
    <line x1="310" y1="300" x2="280" y2="330"/>
  </g>
  <text x="295" y="322" font-size="11.5" fill="#C0392B" text-anchor="middle" font-weight="bold">NVLink &#8212; AllReduce every layer</text>

  <!-- Replica 1 -->
  <rect x="560" y="166" width="450" height="270" rx="10" fill="#F7F7F3" stroke="#57A64A" stroke-width="2.5"/>
  <text x="580" y="194" font-size="15" font-weight="bold" fill="#57A64A">Replica 1 &#8212; second copy, TP=4</text>

  <g stroke="#57A64A" stroke-width="2">
    <rect x="590" y="220" width="180" height="80" fill="#E5F3E2"/>
    <rect x="800" y="220" width="180" height="80" fill="#E5F3E2"/>
    <rect x="590" y="330" width="180" height="80" fill="#E5F3E2"/>
    <rect x="800" y="330" width="180" height="80" fill="#E5F3E2"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">
    <text x="680" y="248">GPU4</text>
    <text x="890" y="248">GPU5</text>
    <text x="680" y="358">GPU6</text>
    <text x="890" y="358">GPU7</text>
  </g>
  <g font-size="12" fill="#6B6B66" text-anchor="middle">
    <text x="680" y="268">1/4 of every layer</text>
    <text x="890" y="268">1/4 of every layer</text>
    <text x="680" y="378">1/4 of every layer</text>
    <text x="890" y="378">1/4 of every layer</text>
    <text x="680" y="286">~35 GB weights</text>
    <text x="890" y="286">~35 GB weights</text>
    <text x="680" y="396">~35 GB weights</text>
    <text x="890" y="396">~35 GB weights</text>
  </g>
  <g stroke="#E05C7A" stroke-width="1.8" stroke-dasharray="6,4">
    <line x1="770" y1="260" x2="800" y2="260"/>
    <line x1="770" y1="370" x2="800" y2="370"/>
    <line x1="680" y1="300" x2="680" y2="330"/>
    <line x1="890" y1="300" x2="890" y2="330"/>
    <line x1="770" y1="300" x2="800" y2="330"/>
    <line x1="800" y1="300" x2="770" y2="330"/>
  </g>
  <text x="785" y="322" font-size="11.5" fill="#C0392B" text-anchor="middle" font-weight="bold">NVLink &#8212; AllReduce every layer</text>

  <!-- no traffic between replicas -->
  <text x="540" y="462" font-size="13" fill="#6B6B66" text-anchor="middle" font-style="italic">no model traffic between the two replicas during inference &#8212; they are independent servers</text>

  <!-- summary -->
  <line x1="40" y1="484" x2="1040" y2="484" stroke="#D8D8D2" stroke-width="1"/>
  <g font-size="14" fill="#2C2C2A">
    <text x="60" y="514"><tspan font-weight="bold" fill="#1F3B5C">Inside a replica (TP=4):</tspan> 140 GB of FP16 weights &#247; 4 &#8776; 35 GB per GPU &#8212; the model fits, and 4 GPUs compute each token together.</text>
    <text x="60" y="540"><tspan font-weight="bold" fill="#1F3B5C">Across replicas (DP=2):</tspan> two independent instances &#8594; roughly 2&#215; the throughput for concurrent users.</text>
    <text x="60" y="566"><tspan font-weight="bold" fill="#1F3B5C">Rule of thumb:</tspan> TP stays inside the NVLink domain; DP (or PP) crosses nodes over the ordinary network.</text>
  </g>
</svg>
