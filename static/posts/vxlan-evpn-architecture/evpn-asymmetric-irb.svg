<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">BGP VXLAN EVPN asymmetric IRB packet path</title>
  <desc id="desc">Host A sends traffic through Leaf 1, destination L2 VNI 10020 across the IP fabric, and Leaf 2 to Host B. Only Leaf 1 performs an IP routing lookup; Leaf 2 only bridges.</desc>
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#49627e"/></marker>
    <filter id="shadow2"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
    <style>
      .t2{font-family:Inter,'Segoe UI',Arial,sans-serif}
      .title2{font-size:34px;font-weight:750;fill:#e5eef9}
      .subtitle2{font-size:18px;font-weight:450;fill:#9fb0c5}
      .label2{font-size:22px;font-weight:650;fill:#e5eef9}
      .sub2{font-size:15px;font-weight:450;fill:#9fb0c5}
      .route-badge2{font-size:15px;font-weight:700;fill:#7dd3fc}
      .bridge-badge2{font-size:15px;font-weight:700;fill:#6ee7b7}
      .vni2{font-size:17px;font-weight:750;fill:#fbbf24}
      .summary2{font-size:18px;font-weight:450;fill:#9fb0c5}
      .takeaway2{font-size:18px;font-weight:700;fill:#fbbf24}
      .footer2{font-size:15px;font-weight:500;fill:#9fb0c5}
      .flow2{stroke:#49627e;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow2)}
    </style>
  </defs>
  <rect width="1280" height="600" fill="#07111f"/>
  <text class="t2 title2" x="64" y="68">Asymmetric IRB — routing only at the ingress VTEP</text>
  <text class="t2 subtitle2" x="64" y="102">The same flow crosses the fabric in the destination subnet's L2 VNI 10020 — Leaf 2 never routes it</text>

  <g filter="url(#shadow2)">
    <rect x="64" y="222" width="185" height="116" rx="14" fill="#152944" stroke="#34d399" stroke-width="3"/>
    <text class="t2 label2" x="156.5" y="258" text-anchor="middle">Host A</text>
    <text class="t2 sub2" x="156.5" y="286" text-anchor="middle">10.1.10.11 · VLAN 10</text>
    <text class="t2 sub2" x="156.5" y="310" text-anchor="middle">L2 VNI 10010</text>

    <rect x="287" y="196" width="235" height="168" rx="14" fill="#152944" stroke="#38bdf8" stroke-width="3"/>
    <text class="t2 label2" x="404.5" y="232" text-anchor="middle">Leaf 1 / VTEP 1</text>
    <text class="t2 sub2" x="404.5" y="258" text-anchor="middle">Anycast gateway</text>
    <rect x="317" y="280" width="175" height="60" rx="10" fill="#0f3050" stroke="#38bdf8" stroke-width="1.5"/>
    <text class="t2 route-badge2" x="404.5" y="305" text-anchor="middle">Only IP lookup</text>
    <text class="t2 route-badge2" x="404.5" y="327" text-anchor="middle">VLAN 10 → VLAN 20</text>

    <rect x="560" y="196" width="200" height="168" rx="84" fill="#101e31" stroke="#a78bfa" stroke-width="3"/>
    <text class="t2 label2" x="660" y="240" text-anchor="middle">IP fabric</text>
    <text class="t2 sub2" x="660" y="266" text-anchor="middle">VXLAN transport</text>
    <text class="t2 vni2" x="660" y="298" text-anchor="middle">L2 VNI 10020</text>
    <text class="t2 sub2" x="660" y="324" text-anchor="middle">Destination subnet</text>

    <rect x="798" y="196" width="235" height="168" rx="14" fill="#152944" stroke="#38bdf8" stroke-width="3"/>
    <text class="t2 label2" x="915.5" y="232" text-anchor="middle">Leaf 2 / VTEP 2</text>
    <text class="t2 sub2" x="915.5" y="258" text-anchor="middle">Destination VTEP</text>
    <rect x="828" y="280" width="175" height="60" rx="10" fill="#0d3328" stroke="#34d399" stroke-width="1.5"/>
    <text class="t2 bridge-badge2" x="915.5" y="305" text-anchor="middle">L2 bridging only</text>
    <text class="t2 bridge-badge2" x="915.5" y="327" text-anchor="middle">no IP lookup</text>

    <rect x="1071" y="222" width="145" height="116" rx="14" fill="#152944" stroke="#34d399" stroke-width="3"/>
    <text class="t2 label2" x="1143.5" y="258" text-anchor="middle">Host B</text>
    <text class="t2 sub2" x="1143.5" y="286" text-anchor="middle">10.1.20.22</text>
    <text class="t2 sub2" x="1143.5" y="310" text-anchor="middle">VLAN 20</text>
  </g>

  <line class="flow2" x1="253" y1="280" x2="279" y2="280"/>
  <line class="flow2" x1="526" y1="280" x2="552" y2="280"/>
  <line class="flow2" x1="764" y1="280" x2="790" y2="280"/>
  <line class="flow2" x1="1037" y1="280" x2="1063" y2="280"/>

  <text class="t2 summary2" x="640" y="440" text-anchor="middle">VLAN 10 → route directly into destination L2 VNI 10020 → VXLAN fabric → bridge to Host B</text>
  <text class="t2 takeaway2" x="640" y="480" text-anchor="middle">One IP routing lookup per direction, always on the source-side leaf — the reverse flow rides L2 VNI 10010</text>
  <text class="t2 footer2" x="1216" y="565" text-anchor="end">VXLAN EVPN Architecture</text>
</svg>
