<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Step 1: EVPN Type 4 Ethernet Segment discovery and designated-forwarder election</title>
  <desc id="desc">A customer edge is dual-homed to PE1 and PE2 using ESI 01. PE1 and PE2 exchange Type 4 Ethernet Segment routes through MP-BGP, discover that they share the segment, and elect PE1 as designated forwarder for VLAN 10. Remote PE3 is not attached to ESI 01 and normally does not import the Type 4 routes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L10,4 z" fill="#a78bfa"/>
    </marker>
    <style>
      .title { font: 750 31px Inter, "Segoe UI", Arial, sans-serif; fill: #e5eef9; }
      .subtitle { font: 450 17px Inter, "Segoe UI", Arial, sans-serif; fill: #9fb0c5; }
      .node-title { font: 700 20px Inter, "Segoe UI", Arial, sans-serif; fill: #e5eef9; }
      .body { font: 500 16px Inter, "Segoe UI", Arial, sans-serif; fill: #c8d6e8; }
      .small { font: 500 14px Inter, "Segoe UI", Arial, sans-serif; fill: #9fb0c5; }
      .small-purple { font: 600 14px Inter, "Segoe UI", Arial, sans-serif; fill: #c4b5fd; }
      .pill { font: 650 14px Inter, "Segoe UI", Arial, sans-serif; }
      .result-title { font: 700 19px Inter, "Segoe UI", Arial, sans-serif; fill: #e5eef9; }
      .result-body { font: 500 15px Inter, "Segoe UI", Arial, sans-serif; fill: #c8d6e8; }
      .badge { font: 700 13px Inter, "Segoe UI", Arial, sans-serif; fill: #6ee7b7; }
    </style>
  </defs>

  <rect width="1280" height="620" fill="#07111f"/>
  <text class="title" x="64" y="48">Step 1 · Discover the Ethernet segment</text>
  <text class="subtitle" x="64" y="77">Type 4 ES routes identify same-ES PEs and establish the designated-forwarder candidate set</text>

  <g aria-label="Three-step sequence">
    <rect x="64" y="94" width="180" height="30" rx="15" fill="#e5eef9"/>
    <text class="pill" x="154" y="114" text-anchor="middle" fill="#07111f">1 · Discover ESI</text>
    <rect x="254" y="94" width="228" height="30" rx="15" fill="#101e31" stroke="#49627e"/>
    <text class="pill" x="368" y="114" text-anchor="middle" fill="#9fb0c5">2 · Advertise reachability</text>
    <rect x="492" y="94" width="194" height="30" rx="15" fill="#101e31" stroke="#49627e"/>
    <text class="pill" x="589" y="114" text-anchor="middle" fill="#9fb0c5">3 · Attachment fails</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="140" width="1152" height="344" rx="16" fill="#101e31" stroke="#49627e" stroke-width="2"/>
  </g>

  <line x1="266" y1="302" x2="360" y2="239" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="266" y1="354" x2="360" y2="413" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <text class="small" x="294" y="274">LAG</text>
  <text class="small" x="294" y="399">LAG</text>

  <path d="M565 221 C625 221 654 303 710 309" fill="none" stroke="#a78bfa" stroke-width="4" stroke-dasharray="9 7" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)"/>
  <path d="M565 412 C626 412 654 361 710 351" fill="none" stroke="#a78bfa" stroke-width="4" stroke-dasharray="9 7" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)"/>

  <g filter="url(#shadow)">
    <rect x="96" y="284" width="170" height="96" rx="14" fill="#152944" stroke="#49627e" stroke-width="2"/>
    <rect x="360" y="186" width="205" height="104" rx="14" fill="#152944" stroke="#34d399" stroke-width="3"/>
    <rect x="360" y="360" width="205" height="104" rx="14" fill="#152944" stroke="#a78bfa" stroke-width="3"/>
    <rect x="710" y="278" width="200" height="108" rx="14" fill="#152944" stroke="#a78bfa" stroke-width="2"/>
    <rect x="1000" y="284" width="184" height="96" rx="14" fill="#152944" stroke="#49627e" stroke-width="2" opacity=".58"/>
  </g>

  <text class="node-title" x="181" y="319" text-anchor="middle">CE</text>
  <text class="body" x="181" y="348" text-anchor="middle">ESI 01 · VLAN 10</text>

  <rect x="378" y="151" width="169" height="28" rx="14" fill="#123b31"/>
  <text class="badge" x="462" y="170" text-anchor="middle">DF · VLAN 10</text>
  <text class="node-title" x="462" y="218" text-anchor="middle">PE1</text>
  <text class="body" x="462" y="247" text-anchor="middle">originator PE1 IP</text>
  <text class="small-purple" x="462" y="272" text-anchor="middle">RT-4 · ESI 01</text>

  <rect x="387" y="326" width="151" height="28" rx="14" fill="#2d2448"/>
  <text class="small-purple" x="462" y="345" text-anchor="middle">non-DF</text>
  <text class="node-title" x="462" y="393" text-anchor="middle">PE2</text>
  <text class="body" x="462" y="422" text-anchor="middle">originator PE2 IP</text>
  <text class="small-purple" x="462" y="447" text-anchor="middle">RT-4 · ESI 01</text>

  <text class="node-title" x="810" y="313" text-anchor="middle">MP-BGP / RR</text>
  <text class="body" x="810" y="341" text-anchor="middle">reflects ES routes</text>
  <text class="small-purple" x="810" y="365" text-anchor="middle">ES-Import RT</text>

  <text class="node-title" x="1092" y="318" text-anchor="middle" opacity=".65">Remote PE3</text>
  <text class="body" x="1092" y="348" text-anchor="middle" opacity=".65">same EVPN service</text>

  <line x1="910" y1="332" x2="1000" y2="332" stroke="#64748b" stroke-width="3" stroke-dasharray="6 6" opacity=".65"/>
  <circle cx="955" cy="332" r="14" fill="#401b25" stroke="#fb7185" stroke-width="3"/>
  <path d="M948 325 L962 339 M962 325 L948 339" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
  <text class="small" x="1092" y="410" text-anchor="middle">not attached to ESI 01</text>
  <text class="small" x="1092" y="432" text-anchor="middle">normally does not import RT-4</text>

  <g filter="url(#shadow)">
    <rect x="64" y="500" width="1152" height="84" rx="14" fill="#152944" stroke="#49627e" stroke-width="2"/>
  </g>
  <text class="result-title" x="88" y="527">Type 4 result</text>
  <text class="result-body" x="88" y="551">PE1 and PE2 discover each other as ESI 01 members and elect PE1 as DF for VLAN 10.</text>
  <text class="result-body" x="88" y="574">The DF controls BUM delivery toward the CE; Type 4 does not advertise MAC or VNI reachability.</text>
</svg>
