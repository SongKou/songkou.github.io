<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Step 3: EVPN Type 1 fast withdrawal after an Ethernet segment attachment failure</title>
  <desc id="desc">The entire CE to PE1 attachment fails. PE1 withdraws its Type 1 per-Ethernet-segment and affected per-EVI routes, so Remote PE3 removes PE1 from the eligible next-hop set and uses PE2. PE1 also withdraws its Type 4 route, leaving PE2 as the designated forwarder.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#fb7185"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#34d399"/>
    </marker>
    <style>
      .title { font: 750 31px Inter, "Segoe UI", Arial, sans-serif; fill: #e5eef9; }
      .subtitle { font: 450 17px Inter, "Segoe UI", Arial, sans-serif; fill: #9fb0c5; }
      .node-title { font: 700 20px Inter, "Segoe UI", Arial, sans-serif; fill: #e5eef9; }
      .body { font: 500 16px Inter, "Segoe UI", Arial, sans-serif; fill: #c8d6e8; }
      .small { font: 500 14px Inter, "Segoe UI", Arial, sans-serif; fill: #9fb0c5; }
      .small-red { font: 650 14px Inter, "Segoe UI", Arial, sans-serif; fill: #fda4af; }
      .small-purple { font: 650 14px Inter, "Segoe UI", Arial, sans-serif; fill: #c4b5fd; }
      .small-green { font: 650 14px Inter, "Segoe UI", Arial, sans-serif; fill: #6ee7b7; }
      .pill { font: 650 14px Inter, "Segoe UI", Arial, sans-serif; }
      .result-title { font: 700 19px Inter, "Segoe UI", Arial, sans-serif; fill: #e5eef9; }
      .result-body { font: 500 15px Inter, "Segoe UI", Arial, sans-serif; fill: #c8d6e8; }
      .step { font: 650 13px Inter, "Segoe UI", Arial, sans-serif; fill: #c8d6e8; }
    </style>
  </defs>

  <rect width="1280" height="620" fill="#07111f"/>
  <text class="title" x="64" y="48">Step 3 · Withdraw the failed attachment and converge</text>
  <text class="subtitle" x="64" y="77">Type 1 removes the failed next hop in bulk; Type 4 updates same-ES membership and DF state</text>

  <g aria-label="Three-step sequence">
    <rect x="64" y="94" width="180" height="30" rx="15" fill="#101e31" stroke="#49627e"/>
    <text class="pill" x="154" y="114" text-anchor="middle" fill="#9fb0c5">1 · Discover ESI</text>
    <rect x="254" y="94" width="228" height="30" rx="15" fill="#101e31" stroke="#49627e"/>
    <text class="pill" x="368" y="114" text-anchor="middle" fill="#9fb0c5">2 · Advertise reachability</text>
    <rect x="492" y="94" width="194" height="30" rx="15" fill="#e5eef9"/>
    <text class="pill" x="589" y="114" text-anchor="middle" fill="#07111f">3 · Attachment fails</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="140" width="1152" height="344" rx="16" fill="#101e31" stroke="#49627e" stroke-width="2"/>
  </g>

  <line x1="266" y1="296" x2="360" y2="228" stroke="#fb7185" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <line x1="360" y1="386" x2="266" y2="349" stroke="#34d399" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <text class="small-red" x="96" y="172">whole CE–PE1 attachment down</text>
  <text class="small-green" x="287" y="411">active LAG</text>

  <circle cx="314" cy="261" r="18" fill="#401b25" stroke="#fb7185" stroke-width="3"/>
  <path d="M305 252 L323 270 M323 252 L305 270" stroke="#fb7185" stroke-width="4" stroke-linecap="round"/>

  <path d="M565 203 C706 175 852 218 1000 284" fill="none" stroke="#fb7185" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-red)"/>
  <path d="M565 250 C641 274 644 322 565 349" fill="none" stroke="#a78bfa" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/>
  <path d="M1000 350 C846 392 705 413 565 389" fill="none" stroke="#34d399" stroke-width="5" marker-end="url(#arrow-green)"/>

  <g filter="url(#shadow)">
    <rect x="96" y="284" width="170" height="96" rx="14" fill="#152944" stroke="#49627e" stroke-width="2"/>
    <rect x="360" y="178" width="205" height="104" rx="14" fill="#152944" stroke="#fb7185" stroke-width="3" opacity=".62"/>
    <rect x="360" y="340" width="205" height="96" rx="14" fill="#152944" stroke="#34d399" stroke-width="3"/>
    <rect x="1000" y="262" width="184" height="126" rx="14" fill="#152944" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <text class="node-title" x="181" y="319" text-anchor="middle">CE</text>
  <text class="body" x="181" y="348" text-anchor="middle">ESI 01 · VLAN 10</text>

  <text class="node-title" x="462" y="210" text-anchor="middle" opacity=".65">PE1</text>
  <text class="body" x="462" y="239" text-anchor="middle" opacity=".65">attachment lost</text>
  <text class="small-red" x="462" y="264" text-anchor="middle">withdraws RT-1 and RT-4</text>

  <rect x="390" y="306" width="145" height="28" rx="14" fill="#123b31"/>
  <text class="small-green" x="462" y="325" text-anchor="middle">new DF · VLAN 10</text>
  <text class="node-title" x="462" y="371" text-anchor="middle">PE2</text>
  <text class="body" x="462" y="400" text-anchor="middle">Type 1 remains</text>
  <text class="small-green" x="462" y="424" text-anchor="middle">only eligible next hop</text>

  <text class="small-red" x="780" y="175" text-anchor="middle">withdraw RT-1 per-ES and affected per-EVI</text>
  <text class="small-purple" x="691" y="296" text-anchor="middle">withdraw RT-4</text>
  <text class="small-purple" x="691" y="318" text-anchor="middle">PE1 leaves ESI 01</text>
  <text class="small-green" x="790" y="421" text-anchor="middle">known unicast continues through PE2</text>

  <text class="node-title" x="1092" y="293" text-anchor="middle">Remote PE3</text>
  <text class="small" x="1092" y="322" text-anchor="middle">eligible next hops</text>
  <text class="body" x="1092" y="346" text-anchor="middle">{PE1, PE2} → {PE2}</text>
  <text class="small-green" x="1092" y="370" text-anchor="middle">forward through PE2</text>

  <line x1="95" y1="463" x2="1185" y2="463" stroke="#49627e" stroke-width="2"/>
  <text class="step" x="105" y="454">1 · attachment fails</text>
  <text class="step" x="350" y="454">2 · Type 1 withdrawn</text>
  <text class="step" x="620" y="454">3 · PE3 removes PE1</text>
  <text class="step" x="910" y="454">4 · PE2 becomes DF</text>

  <g filter="url(#shadow)">
    <rect x="64" y="500" width="1152" height="84" rx="14" fill="#152944" stroke="#49627e" stroke-width="2"/>
  </g>
  <text class="result-title" x="88" y="527">Failure result</text>
  <text class="result-body" x="88" y="551">Upon receiving the Type 1 withdrawal, Remote PE3 removes PE1 without waiting for every dependent Type 2 route to age out.</text>
  <text class="result-body" x="88" y="574">PE2 becomes DF and carries the remaining traffic.</text>
</svg>
