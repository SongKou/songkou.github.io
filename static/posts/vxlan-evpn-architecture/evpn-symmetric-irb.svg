<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">BGP VXLAN EVPN symmetric IRB packet path</title>
  <desc id="desc">Host A sends traffic through Leaf 1, tenant L3 VNI 50000 across the IP fabric, and Leaf 2 to Host B. Both leaf switches perform an IP routing lookup.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#49627e"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
    <style>
      .t{font-family:Inter,'Segoe UI',Arial,sans-serif}
      .title{font-size:34px;font-weight:750;fill:#e5eef9}
      .subtitle{font-size:18px;font-weight:450;fill:#9fb0c5}
      .label{font-size:22px;font-weight:650;fill:#e5eef9}
      .sub{font-size:15px;font-weight:450;fill:#9fb0c5}
      .route-badge{font-size:15px;font-weight:700;fill:#7dd3fc}
      .vni{font-size:17px;font-weight:750;fill:#fbbf24}
      .summary{font-size:18px;font-weight:450;fill:#9fb0c5}
      .takeaway{font-size:18px;font-weight:700;fill:#fbbf24}
      .footer{font-size:15px;font-weight:500;fill:#9fb0c5}
      .flow{stroke:#49627e;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="600" fill="#07111f"/>
  <text class="t title" x="64" y="68">Symmetric IRB — routing at both VTEPs</text>
  <text class="t subtitle" x="64" y="102">Host A 10.1.10.11 (VLAN 10) to Host B 10.1.20.22 (VLAN 20) across tenant L3 VNI 50000</text>

  <g filter="url(#shadow)">
    <rect x="64" y="222" width="185" height="116" rx="14" fill="#152944" stroke="#34d399" stroke-width="3"/>
    <text class="t label" x="156.5" y="258" text-anchor="middle">Host A</text>
    <text class="t sub" x="156.5" y="286" text-anchor="middle">10.1.10.11 · VLAN 10</text>
    <text class="t sub" x="156.5" y="310" text-anchor="middle">L2 VNI 10010</text>

    <rect x="287" y="196" width="235" height="168" rx="14" fill="#152944" stroke="#38bdf8" stroke-width="3"/>
    <text class="t label" x="404.5" y="232" text-anchor="middle">Leaf 1 / VTEP 1</text>
    <text class="t sub" x="404.5" y="258" text-anchor="middle">Anycast gateway</text>
    <rect x="317" y="280" width="175" height="60" rx="10" fill="#0f3050" stroke="#38bdf8" stroke-width="1.5"/>
    <text class="t route-badge" x="404.5" y="305" text-anchor="middle">Ingress routing</text>
    <text class="t route-badge" x="404.5" y="327" text-anchor="middle">VLAN 10 → L3 VNI</text>

    <rect x="560" y="196" width="200" height="168" rx="84" fill="#101e31" stroke="#a78bfa" stroke-width="3"/>
    <text class="t label" x="660" y="240" text-anchor="middle">IP fabric</text>
    <text class="t sub" x="660" y="266" text-anchor="middle">VXLAN transport</text>
    <text class="t vni" x="660" y="298" text-anchor="middle">L3 VNI 50000</text>
    <text class="t sub" x="660" y="324" text-anchor="middle">Tenant VRF</text>

    <rect x="798" y="196" width="235" height="168" rx="14" fill="#152944" stroke="#38bdf8" stroke-width="3"/>
    <text class="t label" x="915.5" y="232" text-anchor="middle">Leaf 2 / VTEP 2</text>
    <text class="t sub" x="915.5" y="258" text-anchor="middle">Destination VTEP</text>
    <rect x="828" y="280" width="175" height="60" rx="10" fill="#0f3050" stroke="#38bdf8" stroke-width="1.5"/>
    <text class="t route-badge" x="915.5" y="305" text-anchor="middle">Egress routing</text>
    <text class="t route-badge" x="915.5" y="327" text-anchor="middle">L3 VNI → VLAN 20</text>

    <rect x="1071" y="222" width="145" height="116" rx="14" fill="#152944" stroke="#34d399" stroke-width="3"/>
    <text class="t label" x="1143.5" y="258" text-anchor="middle">Host B</text>
    <text class="t sub" x="1143.5" y="286" text-anchor="middle">10.1.20.22</text>
    <text class="t sub" x="1143.5" y="310" text-anchor="middle">VLAN 20</text>
  </g>

  <line class="flow" x1="253" y1="280" x2="279" y2="280"/>
  <line class="flow" x1="526" y1="280" x2="552" y2="280"/>
  <line class="flow" x1="764" y1="280" x2="790" y2="280"/>
  <line class="flow" x1="1037" y1="280" x2="1063" y2="280"/>

  <text class="t summary" x="640" y="440" text-anchor="middle">VLAN 10 → route into L3 VNI 50000 → VXLAN fabric → route into VLAN 20 → bridge to Host B</text>
  <text class="t takeaway" x="640" y="480" text-anchor="middle">Two IP routing lookups per direction — the reverse flow uses the same L3 VNI 50000</text>
  <text class="t footer" x="1216" y="565" text-anchor="end">VXLAN EVPN Architecture</text>
</svg>
