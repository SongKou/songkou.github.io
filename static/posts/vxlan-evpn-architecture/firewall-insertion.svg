<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fwi-title fwi-desc"><title id="fwi-title">Centralized firewall insertion</title><desc id="fwi-desc">Inter-tenant traffic between VRF RED and VRF BLUE passes only through firewall zones attached to a service or border leaf.</desc><rect width="1280" height="720" fill="#07111f"/><defs><marker id="fwi-arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#49627e"/></marker><filter id="fwi-shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter></defs><text x="64" y="68" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" fill="#e5eef9">Centralized firewall insertion</text><text x="64" y="102" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#9fb0c5">Inter-tenant traffic is steered through a stateful policy boundary</text><g filter="url(#fwi-shadow)"><rect x="64.0" y="280" width="211.2" height="120" rx="14" fill="#152944" stroke="#f87171" stroke-width="3"/><text x="169.6" y="347.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#e5eef9"><tspan x="169.6" dy="0">VRF RED</tspan></text><line x1="280.2" y1="340" x2="294.2" y2="340" stroke="#49627e" stroke-width="4" stroke-linecap="round" marker-end="url(#fwi-arrow)"/><rect x="299.2" y="280" width="211.2" height="120" rx="14" fill="#152944" stroke="#38bdf8" stroke-width="3"/><text x="404.79999999999995" y="337.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#e5eef9"><tspan x="404.79999999999995" dy="0">Service /</tspan><tspan x="404.79999999999995" dy="26.4">Border Leaf</tspan></text><line x1="515.4" y1="340" x2="529.4" y2="340" stroke="#49627e" stroke-width="4" stroke-linecap="round" marker-end="url(#fwi-arrow)"/><rect x="534.4" y="280" width="211.2" height="120" rx="14" fill="#152944" stroke="#fb7185" stroke-width="3"/><text x="640.0" y="337.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#e5eef9"><tspan x="640.0" dy="0">Firewall zones</tspan><tspan x="640.0" dy="26.4">and policy</tspan></text><line x1="750.5999999999999" y1="340" x2="764.5999999999999" y2="340" stroke="#49627e" stroke-width="4" stroke-linecap="round" marker-end="url(#fwi-arrow)"/><rect x="769.5999999999999" y="280" width="211.2" height="120" rx="14" fill="#152944" stroke="#38bdf8" stroke-width="3"/><text x="875.1999999999999" y="337.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#e5eef9"><tspan x="875.1999999999999" dy="0">Service /</tspan><tspan x="875.1999999999999" dy="26.4">Border Leaf</tspan></text><line x1="985.8" y1="340" x2="999.8" y2="340" stroke="#49627e" stroke-width="4" stroke-linecap="round" marker-end="url(#fwi-arrow)"/><rect x="1004.8" y="280" width="211.2" height="120" rx="14" fill="#152944" stroke="#60a5fa" stroke-width="3"/><text x="1110.3999999999999" y="347.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#e5eef9"><tspan x="1110.3999999999999" dy="0">VRF BLUE</tspan></text></g><text x="1216" y="685" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9fb0c5">VXLAN EVPN Architecture</text></svg>