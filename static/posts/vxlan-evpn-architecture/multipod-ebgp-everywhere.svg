<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#07111f"/><defs><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter></defs><text x="64" y="68" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" fill="#e5eef9">Multi-Pod: eBGP-everywhere ASN plan</text><text x="64" y="102" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#9fb0c5">Per-leaf and per-pod ASNs with one transit super-spine AS — next hop and RTs survive only by explicit policy</text><g filter="url(#shadow)"><rect x="90" y="300" width="500" height="270" rx="14" fill="#0e1c30" stroke="#24466b" stroke-width="1.5"/><rect x="690" y="300" width="500" height="270" rx="14" fill="#0e1c30" stroke="#24466b" stroke-width="1.5"/><rect x="397.5" y="156" width="210" height="84" rx="14" fill="#152944" stroke="#a78bfa" stroke-width="3"/><rect x="672.5" y="156" width="210" height="84" rx="14" fill="#152944" stroke="#a78bfa" stroke-width="3"/><rect x="220" y="330" width="240" height="66" rx="12" fill="#152944" stroke="#38bdf8" stroke-width="3"/><rect x="820" y="330" width="240" height="66" rx="12" fill="#152944" stroke="#38bdf8" stroke-width="3"/><rect x="130" y="470" width="190" height="66" rx="12" fill="#152944" stroke="#34d399" stroke-width="3"/><rect x="360" y="470" width="190" height="66" rx="12" fill="#152944" stroke="#34d399" stroke-width="3"/><rect x="730" y="470" width="190" height="66" rx="12" fill="#152944" stroke="#34d399" stroke-width="3"/><rect x="960" y="470" width="190" height="66" rx="12" fill="#152944" stroke="#34d399" stroke-width="3"/></g><line x1="300" y1="330" x2="450" y2="240" stroke="#49627e" stroke-width="2.5" stroke-linecap="round"/><line x1="380" y1="330" x2="725" y2="240" stroke="#49627e" stroke-width="2.5" stroke-linecap="round"/><line x1="900" y1="330" x2="555" y2="240" stroke="#49627e" stroke-width="2.5" stroke-linecap="round"/><line x1="980" y1="330" x2="830" y2="240" stroke="#49627e" stroke-width="2.5" stroke-linecap="round"/><line x1="225" y1="470" x2="290" y2="396" stroke="#49627e" stroke-width="2.5" stroke-linecap="round"/><line x1="455" y1="470" x2="390" y2="396" stroke="#49627e" stroke-width="2.5" stroke-linecap="round"/><line x1="825" y1="470" x2="890" y2="396" stroke="#49627e" stroke-width="2.5" stroke-linecap="round"/><line x1="1055" y1="470" x2="990" y2="396" stroke="#49627e" stroke-width="2.5" stroke-linecap="round"/><text x="502.5" y="190" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#e5eef9">Super-Spine 1</text><text x="502.5" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">AS 65000 · transit</text><text x="777.5" y="190" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#e5eef9">Super-Spine 2</text><text x="777.5" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">AS 65000 · transit</text><text x="905" y="168" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#e5eef9">Every transit tier:</text><text x="905" y="192" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">retain route-target all</text><text x="905" y="214" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">next-hop unchanged out</text><text x="905" y="236" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">send-community extended</text><text x="340" y="358" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" fill="#e5eef9">Spines</text><text x="340" y="382" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">AS 65010</text><text x="940" y="358" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" fill="#e5eef9">Spines</text><text x="940" y="382" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">AS 65020</text><text x="225" y="496" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#e5eef9">Leaf 1</text><text x="225" y="519" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">AS 65111</text><text x="455" y="496" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#e5eef9">Leaf 2</text><text x="455" y="519" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">AS 65112</text><text x="825" y="496" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#e5eef9">Leaf 3</text><text x="825" y="519" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">AS 65211</text><text x="1055" y="496" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#e5eef9">Leaf 4</text><text x="1055" y="519" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">AS 65212</text><text x="106" y="558" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#9fb0c5">Pod 1</text><text x="706" y="558" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#9fb0c5">Pod 2</text><text x="640" y="612" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500"><tspan fill="#9fb0c5">Pod-2 leaf receives a Pod-1 host route with AS path&#160;&#160;</tspan><tspan fill="#fbbf24" font-weight="700">65020 65000 65010 65111</tspan></text><text x="640" y="640" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9fb0c5">All sessions are eBGP — IPv4 underlay and EVPN overlay on the same tiers; per-leaf auto-RTs need fabric-wide RTs or rewrite-evpn-rt-asn</text><text x="1216" y="685" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9fb0c5">VXLAN EVPN Architecture</text></svg>
