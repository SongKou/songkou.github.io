<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#07111f"/><defs><marker id="arrowG" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#49627e"/></marker><marker id="arrowA" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#fbbf24"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter></defs><text x="64" y="68" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" fill="#e5eef9">Multi-Site with an eBGP-everywhere site</text><text x="64" y="102" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#9fb0c5">rewrite-evpn-rt-asn composes hop by hop: after every inbound rewrite the RT looks locally derived</text><text x="64" y="130" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">Solid: site-internal sessions&#160;&#160;·&#160;&#160;dashed amber: site-external eBGP EVPN (peer-type fabric-external + rewrite-evpn-rt-asn)</text><rect x="58" y="240" width="504" height="146" rx="14" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 7"/><rect x="583" y="240" width="154" height="146" rx="14" fill="none" stroke="#49627e" stroke-width="2" stroke-dasharray="8 7"/><rect x="758" y="240" width="458" height="146" rx="14" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="8 7"/><text x="310" y="228" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#38bdf8">Site A — eBGP everywhere · site-id 11</text><text x="660" y="228" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#a78bfa">DCI — AS 65099</text><text x="987" y="228" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#34d399">Site B — iBGP + RR · site-id 22</text><g filter="url(#shadow)"><rect x="70" y="270" width="130" height="84" rx="12" fill="#152944" stroke="#34d399" stroke-width="3"/><rect x="245" y="270" width="130" height="84" rx="12" fill="#152944" stroke="#38bdf8" stroke-width="3"/><rect x="420" y="270" width="130" height="84" rx="12" fill="#152944" stroke="#a78bfa" stroke-width="3"/><rect x="595" y="270" width="130" height="84" rx="12" fill="#152944" stroke="#a78bfa" stroke-width="3"/><rect x="770" y="270" width="130" height="84" rx="12" fill="#152944" stroke="#a78bfa" stroke-width="3"/><rect x="945" y="270" width="240" height="84" rx="12" fill="#152944" stroke="#34d399" stroke-width="3"/></g><line x1="202" y1="312" x2="241" y2="312" stroke="#49627e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowG)"/><line x1="377" y1="312" x2="416" y2="312" stroke="#49627e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowG)"/><line x1="552" y1="312" x2="591" y2="312" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#arrowA)"/><line x1="727" y1="312" x2="766" y2="312" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#arrowA)"/><line x1="902" y1="312" x2="941" y2="312" stroke="#49627e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowG)"/><text x="135" y="306" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#e5eef9">Leaf-A1</text><text x="135" y="330" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">AS 65012</text><text x="310" y="306" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#e5eef9">Spine-A</text><text x="310" y="330" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">AS 65011</text><text x="485" y="306" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#e5eef9">BGW-A</text><text x="485" y="330" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">AS 65010</text><text x="660" y="306" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#e5eef9">Route server</text><text x="660" y="330" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">AS 65099</text><text x="835" y="306" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#e5eef9">BGW-B</text><text x="835" y="330" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">AS 65020</text><text x="1065" y="296" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#e5eef9">Site B fabric</text><text x="1065" y="318" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9fb0c5">leaves · spines · RRs</text><text x="1065" y="340" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9fb0c5">iBGP · AS 65020</text><text x="56" y="416" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#9fb0c5">RT:</text><text x="135" y="416" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#fbbf24">65012:10100</text><text x="310" y="416" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#fbbf24">65011:10100</text><text x="485" y="416" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#fbbf24">65010:10100</text><text x="660" y="416" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#fbbf24">65099:10100</text><text x="835" y="416" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#fbbf24">65020:10100</text><text x="1065" y="416" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#fbbf24">65020:10100 ✓</text><text x="56" y="448" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#9fb0c5">NH:</text><text x="135" y="448" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">10.1.0.21</text><text x="310" y="448" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">10.1.0.21</text><text x="485" y="448" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#e5eef9">10.10.10.10 (VIP-A)</text><text x="660" y="448" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">10.10.10.10</text><text x="835" y="448" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#e5eef9">10.20.20.20 (VIP-B)</text><text x="1065" y="448" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">10.20.20.20</text><text x="640" y="490" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9fb0c5">Each column shows the route as that device advertises it — RTs rewritten inbound at every eBGP hop, next hop rewritten only by the BGWs</text><text x="640" y="528" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500"><tspan fill="#9fb0c5">AS path when BGW-B receives the route:&#160;&#160;</tspan><tspan fill="#fbbf24" font-weight="700">65099 65010 65011 65012</tspan></text><text x="640" y="556" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9fb0c5">Site B runs one AS inside, so no further rewriting is needed — the BGW's rewritten RT already matches every leaf's auto-derived import</text><text x="1216" y="685" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9fb0c5">VXLAN EVPN Architecture</text></svg>
