<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#07111f"/><defs><marker id="arrowOut" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#38bdf8"/></marker><marker id="arrowIn" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#34d399"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter></defs><text x="64" y="68" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" fill="#e5eef9">Multi-Site walk in an eBGP-everywhere site</text><text x="64" y="102" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#9fb0c5">Site A rebuilt with per-tier ASNs — what changes in each direction of the control-plane walk</text><rect x="462" y="126" width="356" height="362" rx="16" fill="#101e31" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 7"/><text x="478" y="150" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#38bdf8">Site A</text><text x="478" y="168" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9fb0c5">site-id 11</text><g filter="url(#shadow)"><rect x="565" y="140" width="150" height="30" rx="15" fill="#0e1c30" stroke="#49627e" stroke-width="2"/><rect x="490" y="186" width="300" height="64" rx="12" fill="#152944" stroke="#34d399" stroke-width="3"/><rect x="490" y="290" width="300" height="64" rx="12" fill="#152944" stroke="#38bdf8" stroke-width="3"/><rect x="490" y="394" width="300" height="76" rx="12" fill="#152944" stroke="#a78bfa" stroke-width="3"/><rect x="490" y="505" width="300" height="44" rx="12" fill="#0d1a2c" stroke="#49627e" stroke-width="2" stroke-dasharray="8 7"/></g><line x1="640" y1="170" x2="640" y2="186" stroke="#49627e" stroke-width="2.5" stroke-linecap="round"/><line x1="640" y1="250" x2="640" y2="290" stroke="#49627e" stroke-width="2.5" stroke-linecap="round"/><line x1="640" y1="354" x2="640" y2="394" stroke="#49627e" stroke-width="2.5" stroke-linecap="round"/><line x1="640" y1="470" x2="640" y2="505" stroke="#49627e" stroke-width="2.5" stroke-linecap="round"/><text x="640" y="160" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9fb0c5">Host 192.168.1.10</text><text x="640" y="214" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#e5eef9">Leaf-A1 — AS 65012</text><text x="640" y="238" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9fb0c5">VTEP 10.1.0.21</text><text x="640" y="318" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#e5eef9">Spines — AS 65011</text><text x="640" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#9fb0c5">retain route-target all · NH unchanged</text><text x="640" y="420" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#e5eef9">BGW-A1 / BGW-A2 — AS 65010</text><text x="640" y="442" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9fb0c5">PIPs 10.1.0.11, 10.1.0.12</text><text x="640" y="461" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#fbbf24">Multi-Site VIP 10.10.10.10</text><text x="640" y="532" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#9fb0c5">DCI — route servers, AS 65099</text><text x="255" y="180" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#38bdf8">Outbound — leaf route to the DCI</text><line x1="452" y1="200" x2="452" y2="495" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowOut)"/><text x="430" y="212" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#fbbf24">exports RT 65012:10100</text><text x="430" y="234" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">NH 10.1.0.21</text><text x="430" y="316" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#fbbf24">rewrite → 65011:10100</text><text x="430" y="338" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">NH unchanged</text><text x="430" y="414" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#fbbf24">rewrite → 65010:10100</text><text x="430" y="436" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#e5eef9">re-originate: NH 10.10.10.10 (VIP-A)</text><text x="430" y="458" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">secondary RD 11:10100</text><text x="430" y="530" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#e5eef9">AS path 65010 65011 65012</text><text x="1033" y="180" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#34d399">Inbound — remote route to the leaves</text><line x1="828" y1="495" x2="828" y2="200" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowIn)"/><text x="850" y="212" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#fbbf24">imports 65012:10100</text><text x="850" y="234" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">remote hosts installed behind the VIP</text><text x="850" y="316" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#fbbf24">rewrite → 65011:10100</text><text x="850" y="338" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#e5eef9">NH unchanged — the VIP must survive</text><text x="850" y="414" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#fbbf24">rewrite → 65010:10100</text><text x="850" y="436" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#e5eef9">re-originate inward: NH 10.10.10.10 (VIP-A)</text><text x="850" y="530" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9fb0c5">arrives from the RS: RT 65099:10100</text><text x="640" y="605" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#e5eef9">Same rules at every hop: rewrite-evpn-rt-asn inbound, next-hop unchanged outbound — the section 12.2 transit checklist inside a site</text><text x="640" y="632" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9fb0c5">Data plane: unchanged — packets still ride leaf → VIP → VIP → leaf regardless of the internal model</text><text x="1216" y="685" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9fb0c5">VXLAN EVPN Architecture</text></svg>
